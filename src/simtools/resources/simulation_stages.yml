# Stages of simulation chains.
#
# A chain is an ordered list of these stage names (see simtools.runners.stages). A stage names its
# class ("module:Class", imported when the stage is first used) and the software it needs: the
# names of the software of the model-parameter schemas ("simulation_software": corsika,
# sim_telarray, obdeect) and any further program a stage runs.
#
# A stage with `converter: true` only converts one data product into another. Converters are
# inserted between two stages of a chain when the products do not match.
#
# A new stage is an entry here; no code changes in the registry or the chain specification.
---
stages:
  corsika:
    class: simtools.runners.corsika_stage:CorsikaStage
    software: [corsika]
  sim_telarray:
    class: simtools.runners.sim_telarray_stage:SimTelArrayStage
    software: [sim_telarray]
  corsika_to_stream:
    class: simtools.runners.adapter_stages:CorsikaToStreamStage
    software: [obdeect]
    converter: true
  stream_to_simtel:
    class: simtools.runners.adapter_stages:StreamToSimtelStage
    software: [obdeect]
    converter: true
  obdeect_atmosphere:
    class: simtools.runners.atmosphere_stage:ObdeectAtmosphereStage
    software: [obdeect]
  obdeect_optics:
    class: simtools.runners.optics_stage:ObdeectOpticsStage
    software: [obdeect]
  obdeect_flasher:
    class: simtools.runners.light_source_stages:FlasherSourceStage
    software: [obdeect]
  obdeect_illuminator:
    class: simtools.runners.light_source_stages:IlluminatorSourceStage
    software: [obdeect]
