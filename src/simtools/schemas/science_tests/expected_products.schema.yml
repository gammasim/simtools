---
$schema: http://json-schema.org/draft-06/schema#
$ref: '#/definitions/ExpectedProducts'
title: Science-test expected products
description: Product file patterns required for each science-test step.
schema_version: 0.1.0
schema_name: science_tests/expected_products.schema
type: object
additionalProperties: false

definitions:
  ExpectedProducts:
    type: object
    additionalProperties: false
    properties:
      version:
        const: 1
      tests:
        type: object
        minProperties: 1
        additionalProperties:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    required: [tests]
