---
$schema: http://json-schema.org/draft-06/schema#
$ref: '#/definitions/ScienceTestThresholds'
title: Science-test acceptance thresholds
description: Product and numerical acceptance rules for science-test steps.
schema_version: 0.1.0
schema_name: science_tests/thresholds.schema
type: object
additionalProperties: false

definitions:
  MetricRule:
    type: object
    additionalProperties: false
    properties:
      file:
        type: string
        minLength: 1
      key:
        type: string
        minLength: 1
      format:
        enum: [json, csv]
      field:
        type: string
      select:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      minimum:
        type: number
      maximum:
        type: number
      warning_maximum:
        type: number
      minimum_entries:
        type: integer
        minimum: 1
    required: [file, key]
  AcceptanceRule:
    type: object
    additionalProperties: false
    properties:
      mode:
        enum: [advisory, blocking, thresholds]
      metrics:
        type: array
        items:
          $ref: '#/definitions/MetricRule'
    required: [mode]
  ScienceTestThresholds:
    type: object
    additionalProperties: false
    properties:
      version:
        const: 1
      rules:
        type: object
        additionalProperties:
          $ref: '#/definitions/AcceptanceRule'
    required: [rules]
