---
$schema: http://json-schema.org/draft-06/schema#
$ref: '#/definitions/ScienceTestCatalogue'
title: Science-test catalogue
description: Test definitions and dependencies for science-test campaigns.
schema_version: 0.3.0
schema_name: science_tests/catalogue.schema
type: object
additionalProperties: false

definitions:
  TestDefinition:
    type: object
    additionalProperties: false
    properties:
      workflow:
        description: Workflow path relative to the template or release directory.
        type: string
        minLength: 1
      sites:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      tier:
        description: Cost class of the test.
        enum: [smoke, release-light, release-prod]
      depends_on:
        type: array
        uniqueItems: true
        items:
          type: string
      requires:
        description: Input file patterns that must match non-empty files.
        type: array
        items:
          type: string
      produces_production:
        description: Submits production jobs; requires explicit selection and --allow_production.
        type: boolean
      affects_production:
        description: Changes production inputs; reruns invalidate downstream results.
        type: boolean
      collect_production:
        description: Collects submitted production jobs instead of running the workflow.
        type: boolean
      requires_completed_production:
        type: boolean
      reviewed_grid:
        description: Job grid the completed production is reconciled with.
        type: string
      derived_output:
        description: Output directory of derived products that are reused when current.
        type: string
      acceptance_rule:
        type: string
      runtime_role:
        description: Key of the runtime environment in run_time.yml.
        type: string
        minLength: 1
      result_status_file:
        description: JSON comparison result whose status must be complete.
        type: string
        minLength: 1
      publish_report:
        type: boolean
    required: [workflow, sites, tier]
  ScienceTestCatalogue:
    type: object
    additionalProperties: false
    properties:
      tests:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: '#/definitions/TestDefinition'
    required: [tests]
---
