---
$schema: http://json-schema.org/draft-06/schema#
$ref: '#/definitions/ScienceTestSite'
title: Science-test site suite
description: Site selection and defaults for a science-test campaign.
schema_version: 0.1.0
schema_name: science_tests/site.schema
type: object
additionalProperties: false

definitions:
  ScienceTestSite:
    type: object
    additionalProperties: false
    properties:
      site:
        type: string
        minLength: 1
      site_label:
        type: string
        minLength: 1
      required_tests:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      array_layout_name:
        type: string
        minLength: 1
      replacements:
        type: object
    required: [site, required_tests, array_layout_name]
