---
$schema: http://json-schema.org/draft-07/schema#
title: simtools file types and products
type: object
required: [formats, products]
additionalProperties: false
properties:
  formats:
    type: object
    minProperties: 1
    additionalProperties:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        pattern: '^\.[A-Za-z0-9][A-Za-z0-9._+-]*$'
  products:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [role, retention]
      additionalProperties: false
      properties:
        suffixes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^\.[A-Za-z0-9][A-Za-z0-9._+-]*$'
        suffixes_from:
          type: string
          minLength: 1
        default_suffix:
          type: string
          pattern: '^\.[A-Za-z0-9][A-Za-z0-9._+-]*$'
        filename:
          type: string
          minLength: 1
        role:
          enum: [input, intermediate, result, diagnostic, metadata]
        retention:
          enum: [persistent, temporary, workflow_defined]
        note:
          type: string
      oneOf:
        - required: [filename]
          not:
            anyOf:
              - required: [suffixes]
              - required: [suffixes_from]
              - required: [default_suffix]
        - required: [suffixes]
          not:
            anyOf:
              - required: [filename]
              - required: [suffixes_from]
        - required: [suffixes_from]
          not:
            anyOf:
              - required: [filename]
              - required: [suffixes]
