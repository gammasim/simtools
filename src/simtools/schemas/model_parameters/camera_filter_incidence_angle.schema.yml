%YAML 1.2
---
title: Schema for camera_filter_incidence_angle model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: camera_filter_incidence_angle
description: Distribution of incidence angle on the camera filter.
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: incidence_angle
        description: Incidence angle
        type: float64
        unit: deg
        required: true
      - name: fraction
        description: Fraction
        type: float64
        unit: dimensionless
        required: true
    table_metadata:
      - name: source_file_name
        description: Original source basename
        type: string
        required: true
      - name: original_comments
        description: Original source comments
        type: array
        required: true
      - name: conversion_tool
        description: Conversion utility identifier
        type: string
        required: true
      - name: simtelarray_original_file_name
        description: Original simulator output basename
        type: string
        required: false
      - name: simtelarray_table_format
        description: Simulator serialization format
        type: string
        required: false
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - SimPipe Derived
simulation_software:
  - name: simtools
plot_configuration:
  - type: camera_filter_incidence_angle
    title: Photon incident angles
    xtitle: Photon incident angle [deg]
    ytitle: Fraction
    no_markers: true
    tables:
      - parameter: camera_filter_incidence_angle
        column_x: Incidence angle
        column_y: Fraction
