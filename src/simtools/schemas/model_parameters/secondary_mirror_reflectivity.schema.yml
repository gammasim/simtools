%YAML 1.2
---
title: Schema for secondary_mirror_reflectivity model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: secondary_mirror_reflectivity
surface: secondary
description: 'Secondary mirror reflectivity measured directly on the facet as function
  of wavelength.'
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: wavelength
        description: Wavelength
        type: float64
        unit: nm
        required: true
      - name: incidence_angle
        description: Incidence angle
        type: float64
        unit: deg
        required: false
      - name: reflectivity
        description: Mirror reflectivity
        type: float64
        unit: dimensionless
        required: true
      - name: reflectivity_rms
        description: Mirror reflectivity standard deviation
        type: float64
        unit: dimensionless
        required: false
      - name: reflectivity_min
        description: Minimum mirror reflectivity
        type: float64
        unit: dimensionless
        required: false
      - name: reflectivity_max
        description: Maximum mirror reflectivity
        type: float64
        unit: dimensionless
        required: false
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
    - SetTelescopeEfficiency
  validation:
    - ValidateParameterByExpert
    - ValidateTelescopeEfficiency
    - ValidateTriggerPerformance
    - ValidateTelescopeSimulationModel
source:
  - Calibration
simulation_software:
  - name: sim_telarray
    table_format: rpol_matrix
    internal_parameter_name: mirror_secondary_reflectivity
    serialization:
      columns: [wavelength, reflectivity]
      allowed_columns:
        [wavelength, incidence_angle, reflectivity, reflectivity_rms, reflectivity_min, reflectivity_max]
      row_sort_keys: [wavelength, incidence_angle]
      matrix_axes: [wavelength, incidence_angle]
      value_column: reflectivity
      float_format: ".12g"
      write_comments: false
plot_configuration:
  - type: secondary_mirror_reflectivity
    title: Secondary mirror reflectivity
    xtitle: Wavelength [nm]
    ytitle: Reflectivity
    no_markers: true
    tables:
      - parameter: secondary_mirror_reflectivity
        column_x: wavelength
        column_y: reflectivity
---
title: Schema for secondary_mirror_reflectivity model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
developer_note: To be replaced by a data table
name: secondary_mirror_reflectivity
description: |-
  Secondary mirror reflectivity measured directly on the facet as function of
  wavelength.
data:
  - type: file
    unit: dimensionless
    default: 'no_such_reflectivity.dat'
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
    - SetTelescopeEfficiency
  validation:
    - ValidateParameterByExpert
    - ValidateTelescopeEfficiency
    - ValidateTriggerPerformance
    - ValidateTelescopeSimulationModel
source:
  - Calibration
simulation_software:
  - name: sim_telarray
    internal_parameter_name: mirror_secondary_reflectivity
plot_configuration:
  - type: secondary_mirror_reflectivity
    title: 'Secondary mirror reflectivity'
    xtitle: 'Wavelength [nm]'
    ytitle: 'Reflectivity'
    no_markers: true
    tables:
      - parameter: secondary_mirror_reflectivity
        column_x: 'wavelength'
        column_y: 'reflectivity'
