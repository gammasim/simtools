%YAML 1.2
---
title: Schema for secondary_mirror_reflectivity model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: secondary_mirror_reflectivity
description: 'Secondary mirror reflectivity measured directly on the facet as function
  of wavelength.'
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: wavelength
        description: Wavelength
        type: float64
        unit: nm
        required: true
      - name: reflectivity
        description: Mirror reflectivity
        type: float64
        unit: dimensionless
        required: false
      - name: angle
        description: Incidence angle
        type: float64
        unit: deg
        required: false
    table_metadata:
      - name: source_file_name
        description: Original source basename
        type: string
        required: true
      - name: original_comments
        description: Original source comments
        type: array
        required: true
      - name: conversion_tool
        description: Conversion utility identifier
        type: string
        required: true
      - name: simtelarray_original_file_name
        description: Original simulator output basename
        type: string
        required: false
      - name: simtelarray_table_format
        description: Simulator serialization format
        type: string
        required: false
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
    - SetTelescopeEfficiency
  validation:
    - ValidateParameterByExpert
    - ValidateTelescopeEfficiency
    - ValidateTriggerPerformance
    - ValidateTelescopeSimulationModel
source:
  - Calibration
simulation_software:
  - name: sim_telarray
    internal_parameter_name: mirror_secondary_reflectivity
plot_configuration:
  - type: secondary_mirror_reflectivity
    title: Secondary mirror reflectivity
    xtitle: Wavelength [nm]
    ytitle: Reflectivity
    no_markers: true
    tables:
      - parameter: secondary_mirror_reflectivity
        column_x: wavelength
        column_y: reflectivity
---
title: Schema for secondary_mirror_reflectivity model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
developer_note: To be replaced by a data table
name: secondary_mirror_reflectivity
description: |-
  Secondary mirror reflectivity measured directly on the facet as function of
  wavelength.
data:
  - type: file
    unit: dimensionless
    default: 'no_such_reflectivity.dat'
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
    - SetTelescopeEfficiency
  validation:
    - ValidateParameterByExpert
    - ValidateTelescopeEfficiency
    - ValidateTriggerPerformance
    - ValidateTelescopeSimulationModel
source:
  - Calibration
simulation_software:
  - name: sim_telarray
    internal_parameter_name: mirror_secondary_reflectivity
plot_configuration:
  - type: secondary_mirror_reflectivity
    title: 'Secondary mirror reflectivity'
    xtitle: 'Wavelength [nm]'
    ytitle: 'Reflectivity'
    no_markers: true
    tables:
      - parameter: secondary_mirror_reflectivity
        column_x: 'wavelength'
        column_y: 'reflectivity'
