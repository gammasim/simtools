%YAML 1.2
---
title: Schema for camera_pixel_layout model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: camera_pixel_layout
description: Validated pixel layout used to generate a sim_telarray camera file.
data:
  - type: file
    unit: dimensionless
    table_columns:
      - {name: pixel_id, description: Pixel identifier, type: int64, required: true}
      - {name: type_id, description: Pixel type identifier, type: int64, required: true}
      - {name: x_cm, description: Pixel x position, type: float64, unit: cm, required: true}
      - {name: y_cm, description: Pixel y position, type: float64, unit: cm, required: true}
      - {name: module, description: Module number, type: int64, required: true}
      - {name: board, description: Board number, type: int64, required: true}
      - {name: channel, description: Channel number, type: int64, required: true}
      - {name: module_id, description: Board identifier, type: string, required: true}
      - {name: enabled, description: Pixel enabled state, type: int64, required: true}
      - {name: relative_qe, description: Relative quantum efficiency, type: float64, required: true}
      - {name: relative_gain, description: Relative pixel gain, type: float64, required: true}
      - {name: z_offset_cm, description: Pixel z offset, type: float64, unit: cm, required: true}
      - {name: rotation_deg, description: Pixel rotation, type: float64, unit: deg, required: true}
      - {name: normal_x, description: Pixel normal x component, type: float64, required: true}
      - {name: normal_y, description: Pixel normal y component, type: float64, required: true}
    table_metadata:
      - {name: parameter_name, description: Owning model parameter, type: string, required: true}
      - {name: parameter_version, description: Owning parameter version, type: string, required: true}
      - {name: instrument, description: Owning instrument, type: string, required: true}
      - {name: site, description: Owning site, type: string, required: true}
instrument: {class: Camera}
activity: {setting: [SetParameterFromExternal]}
source: [Initial instrument setup]
simulation_software: [{name: sim_telarray}]
