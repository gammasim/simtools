%YAML 1.2
---
title: Schema for fadc_pulse_shape model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: fadc_pulse_shape
description: '(F)ADC pulse shape (amplitude vs time) for low and high gain
  readout chain.  The pulse amplitude scale is ignored and the pulses are
  re-scaled to peak values of par:fadc-amplitude times par:fadc-sensitivity.'
short_description: (F)ADC pulse shape (amplitude vs time).
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: time
        description: Time
        type: float64
        unit: ns
        required: true
      - name: amplitude
        description: High-gain amplitude
        type: float64
        unit: dimensionless
        required: true
      - name: amplitude_low_gain
        description: Low-gain amplitude
        type: float64
        unit: dimensionless
        required: false
    table_metadata:
      - name: source_file_name
        description: Original source basename
        type: string
        required: true
      - name: original_comments
        description: Original source comments
        type: array
        required: true
      - name: conversion_tool
        description: Conversion utility identifier
        type: string
        required: true
      - name: simtelarray_original_file_name
        description: Original simulator output basename
        type: string
        required: false
      - name: simtelarray_table_format
        description: Simulator serialization format
        type: string
        required: false
instrument:
  class: Camera
activity:
  setting:
    - SetReadoutPulseShape
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
    - ValidateCameraChargeResponse
    - ValidateCameraTimeResponse
source:
  - Calibration
simulation_software:
  - name: sim_telarray
plot_configuration:
  - type: fadc_pulse_shape
    title: FADC pulse shape
    xtitle: Time [ns]
    ytitle: Amplitude [a.u.]
    xscale: linear
    yscale: linear
    no_markers: true
    tables:
      - parameter: fadc_pulse_shape
        column_x: time
        column_y: amplitude
---
title: Schema for fadc_pulse_shape model parameter
schema_version: 0.2.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: fadc_pulse_shape
description: |-
  (F)ADC pulse shape (amplitude vs time) for low and high gain
  readout chain. The pulse amplitude scale is ignored and the pulses are
  re-scaled to peak values of par:fadc-amplitude times par:fadc-sensitivity.
short_description: (F)ADC pulse shape (amplitude vs time).
data:
  - type: dict
    json_schema:
      type: object
      additionalProperties: false
      required:
        - columns
        - column_units
        - rows
      properties:
        columns:
          type: array
          oneOf:
            - type: array
              items:
                - const: time
                - const: amplitude
              additionalItems: false
              minItems: 2
              maxItems: 2
            - type: array
              items:
                - const: time
                - const: amplitude
                - const: "amplitude (low gain)"
              additionalItems: false
              minItems: 3
              maxItems: 3
        column_units:
          type: array
          oneOf:
            - type: array
              items:
                - const: ns
                - const: dimensionless
              additionalItems: false
              minItems: 2
              maxItems: 2
            - type: array
              items:
                - const: ns
                - const: dimensionless
                - const: dimensionless
              additionalItems: false
              minItems: 3
              maxItems: 3
        rows:
          type: array
          items:
            oneOf:
              - type: array
                items:
                  - type: number
                  - type: number
                additionalItems: false
                minItems: 2
                maxItems: 2
              - type: array
                items:
                  - type: number
                  - type: number
                  - type: number
                additionalItems: false
                minItems: 3
                maxItems: 3
instrument:
  class: Camera
activity:
  setting:
    - SetReadoutPulseShape
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
    - ValidateCameraChargeResponse
    - ValidateCameraTimeResponse
source:
  - Calibration
simulation_software:
  - name: sim_telarray
    meta_parameter_mode: add
plot_configuration:
  - type: fadc_pulse_shape
    title: 'FADC pulse shape'
    xtitle: 'Time [ns]'
    ytitle: 'Amplitude [a.u.]'
    xscale: 'linear'
    yscale: 'linear'
    no_markers: true
    tables:
      - parameter: fadc_pulse_shape
        column_x: 'time'
        column_y: 'amplitude'
---
