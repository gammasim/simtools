%YAML 1.2
---
title: Schema for optics_properties model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: optics_properties
description: Derived properties of the telescope optics.
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: Off-axis_angle
        description: Off-axis angle
        type: float64
        unit: deg
        required: true
      - name: d80_cm
        description: D80
        type: float64
        unit: cm
        required: true
      - name: d80_deg
        description: D80
        type: float64
        unit: deg
        required: true
      - name: eff_area
        description: Effective area
        type: float64
        unit: m2
        required: true
        input_processing:
          - allow_nan
      - name: eff_flen
        description: Effective focal length
        type: float64
        unit: cm
        required: true
        input_processing:
          - allow_nan
    table_metadata:
      - name: source_file_name
        description: Original source basename
        type: string
        required: true
      - name: original_comments
        description: Original source comments
        type: array
        required: true
      - name: simtelarray_original_file_name
        description: Original simulator output basename
        type: string
        required: false
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - SimPipe Derived
---
title: Schema for optics_properties model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
developer_note: To be replaced by a data table
name: optics_properties
description: |-
  Derived properties of the telescope optics.
data:
  - type: file
    unit: dimensionless
    default: 'no_such_file.dat'
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - SimPipe Derived
