%YAML 1.2
---
title: Schema for optics_properties model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: optics_properties
description: Derived properties of the telescope optics.
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: off_axis_angle
        description: Off-axis angle
        type: float64
        unit: deg
        required: true
      - name: d80_cm
        description: D80
        type: float64
        unit: cm
        required: true
      - name: d80_deg
        description: D80
        type: float64
        unit: deg
        required: true
      - name: eff_area
        description: Effective area
        type: float64
        unit: m2
        required: true
        input_processing:
          - allow_nan
      - name: eff_flen
        description: Effective focal length
        type: float64
        unit: cm
        required: true
        input_processing:
          - allow_nan
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - SimPipe Derived
plot_configuration:
  - type: optics_d80_cm_vs_off_axis_angle
    title: D80 versus off-axis angle
    xtitle: Off-axis angle [deg]
    ytitle: D80 [cm]
    no_markers: true
    tables:
      - parameter: optics_properties
        label: D80 [cm]
        column_x: off_axis_angle
        column_y: d80_cm
  - type: optics_d80_deg_vs_off_axis_angle
    title: Angular D80 versus off-axis angle
    xtitle: Off-axis angle [deg]
    ytitle: D80 [deg]
    no_markers: true
    tables:
      - parameter: optics_properties
        label: D80 [deg]
        column_x: off_axis_angle
        column_y: d80_deg
  - type: optics_effective_area_vs_off_axis_angle
    title: Effective area versus off-axis angle
    xtitle: Off-axis angle [deg]
    ytitle: Effective area [m2]
    no_markers: true
    tables:
      - parameter: optics_properties
        label: Effective area [m2]
        column_x: off_axis_angle
        column_y: eff_area
  - type: optics_effective_focal_length_vs_off_axis_angle
    title: Effective focal length versus off-axis angle
    xtitle: Off-axis angle [deg]
    ytitle: Effective focal length [cm]
    no_markers: true
    tables:
      - parameter: optics_properties
        label: Effective focal length [cm]
        column_x: off_axis_angle
        column_y: eff_flen
---
title: Schema for optics_properties model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
developer_note: To be replaced by a data table
name: optics_properties
description: |-
  Derived properties of the telescope optics.
data:
  - type: file
    unit: dimensionless
    default: 'no_such_file.dat'
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - SimPipe Derived
