%YAML 1.2
---
title: Schema for primary_mirror_segmentation model parameter
schema_version: 0.2.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: primary_mirror_segmentation
description: Validated mirror segment and segment-group definitions.
data:
  - type: dict
    json_schema:
      type: array
      minItems: 1
      items:
        oneOf:
          - type: object
            additionalProperties: false
            required: [kind, count, r_min_cm, r_max_cm, dphi_deg]
            properties:
              kind: {type: string, enum: [ring]}
              count: {type: integer, minimum: 1}
              r_min_cm: {type: number, minimum: 0}
              r_max_cm: {type: number, minimum: 0}
              dphi_deg: {type: number, exclusiveMinimum: 0}
              phi0_deg: {type: number}
              gap_cm: {type: number, minimum: 0}
          -
            type: object
            additionalProperties: false
            required: [kind, x_cm, y_cm, diameter_cm]
            properties:
              kind: {type: string, enum: [square, hex, yhex, circular]}
              count: {type: integer, minimum: 1, maximum: 1}
              x_cm: {type: number}
              y_cm: {type: number}
              diameter_cm: {type: number, exclusiveMinimum: 0}
              rotation_deg: {type: number}
          - type: object
            additionalProperties: false
            required: [kind, vertices_cm]
            properties:
              kind: {type: string, enum: [polygon]}
              count: {type: integer, minimum: 1, maximum: 1}
              rotation_deg: {type: number}
              vertices_cm:
                type: array
                minItems: 3
                items:
                  type: object
                  additionalProperties: false
                  required: [x_cm, y_cm]
                  properties:
                    x_cm: {type: number}
                    y_cm: {type: number}
instrument:
  class: Structure
activity:
  setting: [SetParameterFromExternal]
  validation: [ValidateParameterByExpert, ValidateTelescopeStructure, ValidateTelescopeShadowing]
source: [Initial instrument setup]
simulation_software:
  - name: sim_telarray
    internal_parameter_name: primary_segmentation
    meta_parameter_mode: add
---
title: Schema for primary_mirror_segmentation model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
developer_note: To be replaced by a data table
name: primary_mirror_segmentation
description: |-
  Definition of segments or segment groups of the primary reflector.
short_description: |-
  Definition of segments or segment groups of the primary reflector.
data:
  - type: file
    unit: dimensionless
    default: null
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
    - ValidateTelescopeStructure
    - ValidateTelescopeShadowing
source:
  - Initial instrument setup
simulation_software:
  - name: sim_telarray
    internal_parameter_name: primary_segmentation
    meta_parameter_mode: add
