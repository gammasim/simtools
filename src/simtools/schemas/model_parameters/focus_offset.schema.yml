%YAML 1.2
---
title: Schema for focus_offset model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: focus_offset
description: |-
  Distance of the starlight focus from the camera pixels (light guides)
  entry. In telescopes without dynamic focusing capability (either
  through mirror alignment and camera positioning) this is best set
  such that starlight gets focused onto the camera lid while showers
  are focused onto the pixel entry.
  The offset sets the camera geometry for both starlight and shower light.
  Zenith angle dependence of the focus offset can be applied and includes
  the constant value $\Delta_0$ and terms depending on cosine and sine
  of the zenith angle. The total focus offset is
  $\Delta = \Delta_0 + \Delta_c + \Delta_s$. Both scaling terms must be
  nonzero for sim_telarray to apply either zenith angle correction; otherwise
  the offset is $\Delta_0$.
  For two-mirror telescopes, a positive offset shifts the focal surface away
  from the secondary mirror, typically towards the primary mirror when the
  focal surface lies between the mirrors. The first of the
  par:focal-surface-parameters values also affects the focal surface position.
  If that value already accounts for the desired focus at a typical shower
  maximum distance, use zero offset to avoid applying an additional shift.
short_description: |-
  Distance of the starlight focus from the camera pixels (light guides)
  entry.
data:
  - type: float64
    name: focus_offset
    description: Constant focus offset $\Delta_0$.
    unit: cm
    default: 2.8
  - type: float64
    description: Reference zenith angle $\theta_0$ at which both corrections are zero.
    unit: deg
    default: 28.0
  - type: float64
    description: |-
      Scaling term $k_c$ in
      $\Delta_c = k_c (\cos(\theta)-\cos(\theta_0))$.
    unit: dimensionless
    default: 0.0
  - type: float64
    description: |-
      Scaling term $k_s$ in
      $\Delta_s = k_s (\sin(\theta)-\sin(\theta_0))$.
    unit: dimensionless
    default: 0.0
instrument:
  class: Structure
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
    - ValidateOpticalPSF
source:
  - Initial instrument setup
simulation_software:
  - name: sim_telarray
    meta_parameter_mode: add
  - name: obdeect
