%YAML 1.2
---
title: Schema for correct_nsb_spectrum_to_telescope_altitude model parameter
schema_version: 0.1.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: correct_nsb_spectrum_to_telescope_altitude
description: |-
  Correct the night-sky background spectrum to the telescope altitude from the altitude where
  the Benn & Ellison spectrum was measured.
  The correction is done within sim_telarray
  and is based on the atmospheric transmission to 2200 m a.s.l (atm_trans_2200_1_3_0_0_0.dat).
data:
  - type: file
    unit: dimensionless
    default: "atm_trans_2200_1_3_0_0_0.dat"
instrument:
  class: configuration_sim_telarray
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - Calibration
simulation_software:
  - name: simtools

---
title: Schema for correct_nsb_spectrum_to_telescope_altitude model parameter
schema_version: 0.3.0
meta_schema: simpipe-schema
meta_schema_url: https://raw.githubusercontent.com/gammasim/simtools/main/src/simtools/schemas/model_parameter_and_data_schema.metaschema.yml
meta_schema_version: 0.1.0
name: correct_nsb_spectrum_to_telescope_altitude
description: 'Correct the night-sky background spectrum to the telescope altitude
  from the altitude where

  the Benn & Ellison spectrum was measured.

  The correction is done within sim_telarray

  and is based on the atmospheric transmission to 2200 m a.s.l (atm_trans_2200_1_3_0_0_0.dat).'
data:
  - type: file
    unit: dimensionless
    table_columns:
      - name: wavelength
        description: Wavelength
        type: float64
        unit: nm
        required: true
      - name: altitude
        description: Emission altitude
        type: float64
        unit: km
        required: true
      - name: extinction
        description: Atmospheric extinction
        type: float64
        unit: dimensionless
        required: true
    table_metadata:
      - name: parameter_name
        description: Owning model parameter
        type: string
        required: true
      - name: parameter_version
        description: Owning parameter version
        type: string
        required: true
      - name: instrument
        description: Owning instrument
        type: string
        required: true
      - name: site
        description: Owning site
        type: string
        required: true
      - name: source_file_name
        description: Original source basename
        type: string
        required: true
      - name: original_comments
        description: Original source comments
        type: array
        required: true
      - name: conversion_tool
        description: Conversion utility identifier
        type: string
        required: true
      - name: simtelarray_original_file_name
        description: Original simulator output basename
        type: string
        required: false
      - name: simtelarray_table_format
        description: Simulator serialization format
        type: string
        required: false
instrument:
  class: configuration_sim_telarray
activity:
  setting:
    - SetParameterFromExternal
  validation:
    - ValidateParameterByExpert
source:
  - Calibration
simulation_software:
  - name: simtools
