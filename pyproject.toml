[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=64",
  "setuptools-scm[toml]>=8",
]

[project]
name = "gammasimtools"
description = "Tools for the Simulation System of the CTA Observatory"
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "simtools developers", email = "simtools-developer@desy.de" },
]
requires-python = ">=3.14"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = [
  "version",
]
dependencies = [
  "adjusttext",
  "astropy",
  "boost-histogram",
  "ctao-datamodel>=1.4,<2",
  "ctao-dpps-cosmic-ray-spectra",
  "eventio",
  "h5py",
  "jsonschema",
  "matplotlib",
  "numpy",
  "packaging",
  "particle",
  "pillow",
  "pygit2>=1.19",
  "pyproj",
  "python-dotenv",
  "pyyaml",
  "scipy",
]
optional-dependencies.dev = [
  "flake8",
  "flake8-cognitive-complexity",
  "import-linter",
  "pre-commit",
  "pylint",
  "ruff",
  "vulture",
]
optional-dependencies.doc = [
  "myst-parser",
  "numpydoc",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-design",
  "towncrier",
]
optional-dependencies.htcondor = [
  "htcondor>=25.0.7; platform_system=='Linux'",
]
optional-dependencies.obdeect = [
  "obdeect>=0.6",
]
optional-dependencies.tests = [
  "psutil",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-profiling",
  "pytest-random-order",
  "pytest-repeat",
  "pytest-requirements",
  "pytest-retry",
  "pytest-xdist",
]
urls."bug tracker" = "https://github.com/gammasim/simtools/issues"
urls.documentation = "https://gammasim.github.io/simtools/"
urls.repository = "https://github.com/gammasim/simtools"
scripts.simtools-compare-atmospheres = "simtools.applications.compare_atmospheres:main"
scripts.simtools-compare-productions = "simtools.applications.compare_productions:main"
