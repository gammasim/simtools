[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.exclude = [ "simtools._dev_version.*" ]
package-dir = { "" = "src" }
package-data.simtools = [
  "resources/*.json",
  "resources/*.yml",
  "schemas/*.yml",
  "schemas/input/*.yml",
  "schemas/model_parameters/*.yml",
  "schemas/science_tests/*.yml",
]
data-files.simtools = [ "dependency_versions.yml" ]

[tool.setuptools_scm]
write_to = "src/simtools/_version.py"

[tool.ruff]
line-length = 100
indent-width = 4
exclude = [
  "__init__.py",
  "pyproject.toml",
  "simtools/_version.py",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
# no documentation linting for test files
format.skip-magic-trailing-comma = false
lint.select = [ "E4", "E7", "E9", "F" ]
lint.extend-select = [
  "A",       # built-in shadowing
  "C4",      # comprehension
  "C90",     # mccabe complex structure
  "COM",     # flake8-commas
  "D",       # pydocstyle
  "ERA",     # commented-out code
  "F",       # pyflakes
  "G",       # logging
  "I",       # isort
  "ICN",     # import name conventions
  "ISC",     # implicit string concat rules
  "N",       # pep8 naming
  "NPY",     # numpy
  "PLC2701", # private name imported from another module
  "PT",      # pytest
  "PTH",     # use pathlib
  "RET",     # return statements
  "RUF",     # ruff
  "RUF069",  # float equality comparison (preview)
  "UP",      # pyupgrade
]
lint.ignore = [
  "COM812", # incompatible with ruff format
  "D208",   # over-indentation (incompatible with sphinx)
  "D214",   # section-not-over-indented
  "D215",   # section-underline-not-over-indented
  "G004",   # Logging statement uses f-string
  "ISC001", # incompatible with ruff format
  "PTH123", # open("foo") should be replaced by Path("foo").open()
  "RUF012", # Mutable class attributes should be annotated
]
lint.explicit-preview-rules = true
lint.per-file-ignores."**/tests/**" = [
  "D",
  "PLC2701", # unit tests may test private helpers of the module under test
]
lint.per-file-ignores."**/tests_*.py" = [
  "D",
]
lint.mccabe.max-complexity = 12
lint.pydocstyle.convention = "numpy"
lint.preview = true

[tool.pylint]
main.disable = [
  "logging-fstring-interpolation",
  "R0801",                         # duplications
]
# see https://github.com/pylint-dev/pylint/issues/2289
main.generated-members = [
  "gist_heat_r",
]
# Good variable names which should always be accepted, separated by a comma.
main.good-names = [
  "ax",
  "C1",
  "C2",
  "C3",
  "C4",
  "C4x",
  "ce",
  "e",
  "ex",
  "f",
  "hess",
  "i",
  "im",
  "j",
  "k",
  "lst",
  "magic",
  "mst",
  "n",
  "N1",
  "N2",
  "N3",
  "N4",
  "N4x",
  "r",
  "sct",
  "sh",
  "sst",
  "veritas",
  "x",
  "xx",
  "y",
  "yy",
  "zz",
]
# Ignore files
main.ignore = [
  "__init__.py",
  "_version.py",
  "scm_version.py",
]
# see https://stackoverflow.com/questions/49846940/incorrect-pylint-errors-on-astropy-in-vscode
# (required to suppress warnings from astropy.units when using pylint; not only vscode)
main.ignored-classes = [
  "astropy.units",
]
# Maximum number of arguments for function / method (default=5).
main.max-args = 15
# Maximum number of attributes for a class (see R0902). (default=7)
main.max-attributes = 20
# Maximum number of branch for function / method body. (default=12)
main.max-branches = 15
# Maximum number of characters on a single line.
main.max-line-length = 100
# Maximum number of locals for function / method body (default=15).
main.max-locals = 30
# Maximum number of lines in a module. (default 1000)
main.max-module-lines = 1500
# Maximum number of positional arguments for function / method (default=5.)
main.max-positional-arguments = 15
# Maximum number of public methods for a class (see R0904). (default=20)
main.max-public-methods = 30
# Maximum number of statements in function / method body. (default=50)
main.max-statements = 80
# Minimum number of public methods for a class (see R0903). (default=2)
main.min-public-methods = 1

[tool.codespell]
ignore-words-list = "chec,arrang,livetime,astroid"

[tool.vulture]
# Names kept deliberately although vulture reports them as unused (dynamic use,
# test infrastructure, data fields read by callers).
paths = [ "src/simtools" ]
ignore_names = [
  "_check_run_result",
  "_export_file_parameter_data",
  "_fill_activity_meta",
  "_fill_contact_meta",
  "_fill_context_meta",
  "_fill_instrument_meta",
  "_fill_process_meta",
  "_fill_product_meta",
  "_interpolate_corsika_limits",
  "_parse_line",
  "_plot_xy_heatmap",
  "_read_query_parameter",
  "_remove_line_feed",
  "add_mirrored_options",
  "area_weight",
  "AtmosphericTransmissionWriter",
  "auto_download",
  "cache_hits",
  "cache_misses",
  "check_array_element",
  "check_array_triggers_name",
  "check_astropy_unit",
  "check_astropy_unit_of_length",
  "check_astropy_unit_of_time",
  "check_common_particle_name",
  "create_detailed_parameter_plot",
  "curved_atmosphere_min_zenith_angle",
  "EventReader",
  "ExecutionBackend",
  "final_percentage_diff",
  "from_memory",
  "get_dependency_manifest_digest",
  "get_list_of_test_configurations",
  "get_mirrored_option",
  "GITHUB_BLOB_BASE",
  "iers_degraded_accuracy",
  "LightSourceRayTracingBackend",
  "ModelStorage",
  "number_of_telescopes",
  "ObdeectBackend",
  "peak_timing",
  "read_legacy_lst_single_pe",
  "RpolMatrixWriter",
  "SimtelBackend",
  "skip_multiple_version_test",
  "TEST_RESOURCES_DOWNLOADED",
  "TEST_RESOURCES_GENERATED",
  "TEST_RESOURCES_STATIC",
  "use_network",
  "validate_application_output",
  "validate_release_tag",
  "validate_trigger_histograms_file",
  "X",
  "Y",
]
min_confidence = 60

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = "tests/unit_tests/"
ini_options.pythonpath = [ "tests" ]
ini_options.norecursedirs = [
  "build",
  "docs/_build",
]
ini_options.addopts = [
  "-v",
  "--cov-branch",
  "--cov=simtools",
  "--cov-report=xml",
  "--cov-report=json",
  "--cov-report=term",
  "--import-mode=importlib",
  "-p",
  "pytest_requirements",
  "-rsxXf",
]
ini_options.markers = [
  "uses_model_repository: test reads simulation-model repository data.",
]
ini_options.filterwarnings = [
  # treat warnings as errors
  "error",
  # Ignore the warning about fontTools.misc.py23
  "ignore:The py23 module has been deprecated:DeprecationWarning",
]

[tool.coverage]
run.omit = [ "*__init__*", "src/simtools/_version.py" ]
run.relative_files = true
report.exclude_also = [
  'if __name__ == "__main__":',
]

[tool.towncrier]
package = "simtools"
directory = "docs/changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}](https://github.com/gammasim/simtools/releases/tag/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/gammasim/simtools/pull/{issue})"
underlines = [ "", "", "" ]
fragment.api.name = "API Changes"
fragment.api.showcontent = true
fragment.bugfix.name = "Bugfixes"
fragment.bugfix.showcontent = true
fragment.doc.name = "Documentation"
fragment.doc.showcontent = true
fragment.feature.name = "New Features"
fragment.feature.showcontent = true
fragment.maintenance.name = "Maintenance"
fragment.maintenance.showcontent = true
fragment.model.name = "Simulation model"
fragment.model.showcontent = true

[tool.importlinter]
root_packages = [
  "simtools.application",
  "simtools.applications",
  "simtools.atmosphere",
  "simtools.camera",
  "simtools.configuration",
  "simtools.corsika",
  "simtools.data_model",
  "simtools.io",
  "simtools.job_execution",
  "simtools.layout",
  "simtools.model",
  "simtools.model_repository",
  "simtools.production_configuration",
  "simtools.ray_tracing",
  "simtools.reporting",
  "simtools.runners",
  "simtools.science_tests",
  "simtools.sim_events",
  "simtools.simtel",
  "simtools.simulation",
  "simtools.testing",
  "simtools.utils",
  "simtools.visualization",
]

[[tool.importlinter.contracts]]
name = "simtools layers (see docs/source/developer-guide/architecture.md)"
type = "layers"
layers = [
  "simtools.applications",
  "simtools.application : simtools.configuration : simtools.testing",
  "simtools.science_tests : simtools.production_configuration : simtools.reporting : simtools.runners",
  """\
  simtools.corsika : simtools.simtel : simtools.ray_tracing : simtools.camera : simtools.job_execution : \
  simtools.simulation : simtools.atmosphere\
  """,
  "simtools.visualization",
  "simtools.model : simtools.model_repository : simtools.layout",
  "simtools.io : simtools.data_model : simtools.sim_events",
  "simtools.utils",
