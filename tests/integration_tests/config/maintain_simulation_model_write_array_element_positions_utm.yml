---
applications:
- application: simtools-maintain-simulation-model-write-array-element-positions
  docs:
    title: Write UTM array-element positions to a model repository
    summary: >-
      Convert a North-site UTM position table into versioned array-element model-parameter files.
  configuration:
    array_element_positions_file: ${static:telescope_positions-North-utm.ecsv}
    coordinate_system: utm
    simulation_models_path: simtools-output
    parameter_version: 0.1.0
  integration_tests:
  - test_outputs:
    - path_descriptor: simulation_models_path
      file: array_element_position_utm.json
      output_sub_path: LSTN-04
    - path_descriptor: simulation_models_path
      file: array_element_position_utm.json
      output_sub_path: MSTN-15
  test_name: utm
schema_name: application_workflow.metaschema
schema_version: 0.5.0
