---
applications:
- application: simtools-validate-camera-efficiency
  docs:
    title: Validate the LSTN-02 camera efficiency
    summary: >-
      Calculate LSTN-02 optical throughput and derive its reference night-sky-background rate.
  configuration:
    log_level: info
    model_version: 7.0.0
    output_path: simtools-output
    site: North
    telescope: LSTN-02
    parameter_version: 0.0.99
    write_reference_nsb_rate_as_parameter: true
    zenith_angle: 0.0
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      output_sub_path: LSTN-02/nsb_pixel_rate
      file: nsb_pixel_rate-0.0.99.json
      validations:
      - type: model_parameter
        reference_parameter_name: nsb_pixel_rate
        tolerance: 0.1
    - path_descriptor: output_path
      file: camera_efficiency_summary_North_LSTN-02_za0.0deg_azm000deg.yml
      validations:
      - type: reference
        file: ${generated:camera_efficiency/camera_efficiency_summary_North_LSTN-02_za0.0deg_azm000deg.yml}
        tolerance: 0.001
  model_version_use_current: true
  test_name: LSTN
schema_name: application_workflow.metaschema
schema_version: 0.5.0
