---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  configuration:
    export: utm
    array_element_positions_file: ${static:telescope_positions-North-mercator.ecsv}
    log_level: DEBUG
    model_version: 6.0.2
    site: North
    output_file: test.ecsv
    output_path: simtools-output
    select_assets:
    - LSTN
    - MSTN
    skip_input_validation: true
    skip_output_validation: true
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test.ecsv
      validations:
      - type: reference
        file: ${static:telescope_positions-North-utm.ecsv}
        tolerance: 0.01
        columns: [utm_east, utm_north, altitude]
  test_name: mercator_to_utm_in_table
schema_name: application_workflow.metaschema
schema_version: 0.5.0
