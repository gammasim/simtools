---
applications:
- application: simtools-simulate-flasher
  docs:
    title: LST full_simulation saturation scan
    summary: Simulate four illumination levels and analyze both raw gain channels.
  configuration:
    run_mode: full_simulation
    light_source_type: flat_fielding
    telescopes:
    - LSTN-01
    model_version: 8.0.0
    site: North
    run_number: 100
    number_of_events: 2
    flasher_photons:
    - 100000
    - 1000000
    - 10000000
    - 100000000
    label: saturation
    output_path: __OUTPUT__/simulation
    overwrite_model_parameters: '{"LSFN-design": {"flasher_bunch_size": 100}, "LSTN-01":
      {"fadc_bins": 120, "fadc_sum_bins": 100}}'
    sim_telarray_seed:
    - 101
    - 102
  test_name: validate_saturation_flasher_lst
- application: simtools-analyze-flasher-response
  configuration:
    simtel_files:
    - __OUTPUT__/simulation/sim_telarray/full_simulation_run000100_North_8.0.0_saturation_LSTN-01.simtel.zst
    illumination:
    - 100000
    - 1000000
    - 10000000
    - 100000000
    events_per_level:
    - 2
    telescope: LSTN-01
    pixels:
    - 0
    output_path: __OUTPUT__
  test_name: analyze_response
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: flasher_response.ecsv
      validations:
      - type: table
        minimum_rows: 8
        columns:
          gain:
            allowed_values:
            - HG
            - LG
          peak_adc:
            range:
              minimum: 0
          width_ns:
            range:
              minimum: 0
    - path_descriptor: output_path
      file: flasher_response.pdf
    - path_descriptor: output_path
      file: flasher_response_summary.ecsv
      validations:
      - type: table
        minimum_rows: 8
schema_name: application_workflow.metaschema
schema_version: 0.7.0
