---
applications:
- application: simtools-generate-array-config
  docs:
    title: Generate a North Alpha array configuration
    summary: >-
      Resolve the version-appropriate North Alpha layout and write its sim_telarray array
      configuration.
  configuration:
    array_layout_name:
      by_version:
        "<7.0.0": alpha
        ">=7.0.0": CTAO-North-Alpha
    model_version: 6.0.2
    output_path: simtools-output
    site: North
  test_name: run
schema_name: application_workflow.metaschema
schema_version: 0.5.0
