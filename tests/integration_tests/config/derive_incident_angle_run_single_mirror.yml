---
applications:
- application: simtools-derive-incident-angle
  configuration:
    site: South
    telescope: LSTS-04
    off_axis_angles: 1.0
    number_of_photons: 10000
    model_version: 6.0.2
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_LSTS-04_off1.ecsv
      output_sub_path: incident_angles
    - path_descriptor: output_path
      file: incident_angles_multi_derive_incident_angle_LSTS-04.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_LSTS-04_off1.log
      output_sub_path: logs
  test_name: incident_angles_single_mirror
schema_name: application_workflow.metaschema
schema_version: 0.5.0
