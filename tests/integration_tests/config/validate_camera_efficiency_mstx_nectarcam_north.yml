---
applications:
- application: simtools-validate-camera-efficiency
  configuration:
    figure_format:
    - pdf
    - png
    log_level: debug
    model_version: 7.0.0
    output_path: simtools-output
    site: North
    telescope: MSTx-NectarCam
    parameter_version: 0.0.99
    write_reference_nsb_rate_as_parameter: true
    zenith_angle: 0.0
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-NectarCam_nsb.pdf
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-NectarCam_nsb.png
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-NectarCam_shower.png
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-NectarCam_shower.pdf
    - path_descriptor: output_path
      output_sub_path: MSTx-NectarCam/nsb_pixel_rate
      file: nsb_pixel_rate-0.0.99.json
      validations:
      - type: model_parameter
        reference_parameter_name: nsb_pixel_rate
        tolerance: 0.1
    - path_descriptor: output_path
      file: camera_efficiency_summary_North_MSTx-NectarCam_za0.0deg_azm000deg.yml
      validations:
      - type: reference
        file: ${generated:camera_efficiency/camera_efficiency_summary_North_MSTx-NectarCam_za0.0deg_azm000deg.yml}
        tolerance: 0.001
  model_version_use_current: true
  test_name: MSTN
schema_name: application_workflow.metaschema
schema_version: 0.5.0
