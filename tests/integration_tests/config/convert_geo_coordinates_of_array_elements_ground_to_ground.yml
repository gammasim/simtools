---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Select North-site telescopes in ground coordinates
    summary: >-
      Read ground-coordinate array positions, select LST and MST elements, and export a
      ground-coordinate table.
  configuration:
    export: ground
    array_element_positions_file: ${static:telescope_positions-North-ground.ecsv}
    model_version: 6.0.2
    site: North
    output_path: simtools-output
    select_assets:
    - LSTN
    - MSTN
  test_name: ground_to_ground
schema_name: application_workflow.metaschema
schema_version: 0.5.0
