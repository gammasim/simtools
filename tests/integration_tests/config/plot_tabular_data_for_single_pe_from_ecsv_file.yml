---
applications:
- application: simtools-plot-tabular-data
  configuration:
    figure_format:
    - pdf
    - png
    output_file: single_pe_data
    output_path: simtools-output
    plot_config: ${static:plot_single_pe_config_from_ecsv_file.yml}
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: single_pe_data.pdf
    - path_descriptor: output_path
      file: single_pe_data.png
  test_name: single_pe_legacy_data_from_ecsv_file
schema_name: application_workflow.metaschema
schema_version: 0.5.0
