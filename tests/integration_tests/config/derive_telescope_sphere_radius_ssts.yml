---
applications:
- application: simtools-derive-telescope-sphere-radius
  docs:
    title: Derive the SSTS fiducial sphere radius
    summary: Enclose both SSTS reflector surfaces.
  configuration:
    site: South
    telescope: SSTS-design
    model_version: 7.0.0
    parameter_version: 1.0.0
    ignore_existing_parameter_version: true
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: telescope_sphere_radius.json
      validations:
      - type: format
        format: json
      - type: model_parameter
        reference_parameter_name: telescope_sphere_radius
        tolerance: 0.2
    - path_descriptor: output_path
      file: telescope_sphere_radius.meta.yml
      validations:
      - type: format
        format: yaml
  test_name: derive_telescope_sphere_radius_ssts
schema_name: application_workflow.metaschema
schema_version: 0.6.0
