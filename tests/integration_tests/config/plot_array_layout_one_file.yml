---
applications:
- application: simtools-plot-array-layout
  configuration:
    array_layout_file: ${static:telescope_positions-North-ground.ecsv}
    figure_format:
    - pdf
    - png
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: array_layout_telescope_positions-North-ground.pdf
    - path_descriptor: output_path
      file: array_layout_telescope_positions-North-ground.png
  test_name: one_file
schema_name: application_workflow.metaschema
schema_version: 0.5.0
