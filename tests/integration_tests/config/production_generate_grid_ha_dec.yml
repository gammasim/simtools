---
applications:
- application: simtools-production-generate-grid
  docs:
    title: Grid defined in HA/Dec.
    summary: >
      Point-like simulations with fixed offsets.
      Use corsika limits files to adjust energy ranges, view cone, and
      core scatter settings.
  configuration:
    array_layout_name: LSTN-01
    axis:
    - ha 0 deg 360 deg 36 linear
    - dec -90 deg 90 deg 18 linear
    - offset 0 deg 10 deg 2 linear
    core_scatter: 10 500 m
    corsika_he_interaction: epos
    corsika_le_interaction: urqmd
    energy_range: 30 GeV 300 GeV
    corsika_limits: ${downloaded:corsika_limits.ecsv}
    model_version: 7.0.0
    showers_per_run: 5
    showers_per_run_power_law: 0.0 1 TeV
    number_of_runs: 2
    output_file: job_grid_ha_dec.ecsv
    output_path: simtools-output
    primary: gamma
    simulation_software: corsika_sim_telarray
    site: North
    view_cone: 0 deg 10 deg
  integration_tests:
  - output_file: job_grid_ha_dec.ecsv
    output_validation:
    - profile: job_grid
      file: job_grid_ha_dec.ecsv
      columns:
        primary:
          allowed_values: [gamma]
        zenith_angle:
          range:
            minimum: 0.0
            maximum: 180.0
            unit: deg
        ha:
          range:
            minimum: 0.0
            maximum: 360.0
            unit: deg
        dec:
          range:
            minimum: -90.0
            maximum: 90.0
            unit: deg
        energy_min:
          range:
            minimum: 0.0
            maximum: 300.0
            unit: GeV
        energy_max:
          range:
            minimum: 30.0
            maximum: 300.0
            unit: GeV
        core_scatter_max:
          range:
            minimum: 0.0
            maximum: 500.0
            unit: m
        view_cone_min:
          range:
            minimum: 0.0
            maximum: 10.0
            unit: deg
        view_cone_max:
          range:
            minimum: 0.0
            maximum: 10.0
            unit: deg
        model_version:
          allowed_values: ["7.0.0"]
        corsika_le_interaction:
          allowed_values: [urqmd]
        corsika_he_interaction:
          allowed_values: [epos]
  test_name: production_generate_grid_ha_dec
schema_name: application_workflow.metaschema
schema_version: 0.4.0
