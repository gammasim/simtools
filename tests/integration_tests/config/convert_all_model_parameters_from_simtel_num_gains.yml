---
applications:
- application: simtools-convert-all-model-parameters-from-simtel
  configuration:
    output_path: simtools-output
    parameter_version: 0.0.1
    simtel_cfg_file: ${static:simtel_config_test_la_palma.cfg}
    simtel_telescope_name: CT1
    telescope: LSTN-01
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: num_gains-0.0.1.json
      output_sub_path: LSTN-01/num_gains
    - path_descriptor: output_path
      file: telescope_transmission-0.0.1.json
      output_sub_path: LSTN-01/telescope_transmission
  test_name: num_gains
schema_name: application_workflow.metaschema
schema_version: 0.5.0
