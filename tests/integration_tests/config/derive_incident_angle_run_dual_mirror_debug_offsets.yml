---
applications:
- application: simtools-derive-incident-angle
  configuration:
    site: South
    telescope: SSTS-01
    off_axis_angles:
    - 1.0
    - 2.0
    number_of_photons: 1000
    model_version: 6.0.2
    output_path: simtools-output
    debug_plots: true
    calculate_primary_secondary_angles: true
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_SSTS-01_off1.ecsv
      output_sub_path: incident_angles
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_SSTS-01_off2.ecsv
      output_sub_path: incident_angles
    - path_descriptor: output_path
      file: incident_angles_multi_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_angles_primary_multi_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_secondary_xy_heatmap_off1_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_primary_xy_heatmap_off1_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_secondary_radius_vs_angle_multi_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_primary_radius_vs_angle_multi_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_SSTS-01_off1.log
      output_sub_path: logs
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_SSTS-01_off2.log
      output_sub_path: logs
  test_name: incident_angles_dual_mirror_debug_plots
schema_name: application_workflow.metaschema
schema_version: 0.5.0
