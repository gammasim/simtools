---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Convert ground positions to UTM
    summary: >-
      Convert a North-site array-element model parameter from ground coordinates to UTM coordinates.
  preparation:
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_element_position_ground-2.0.0.json
      parameter: array_element_position_ground
      parameter_version: 2.0.0
      site: North
      telescope: MSTN-09
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_element_position_utm-2.0.0.json
      parameter: array_element_position_utm
      parameter_version: 2.0.0
      site: North
      telescope: MSTN-09
  configuration:
    export: utm
    array_element_positions_file: ${prepared:array_element_position_ground-2.0.0.json}
    log_level: DEBUG
    model_version: 6.0.2
    output_file: test.json
    output_path: simtools-output
    parameter_version: 2.0.0
    site: North
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test.json
      validations:
      - type: reference
        file: ${prepared:array_element_position_utm-2.0.0.json}
        tolerance: 0.01
  test_name: ground_to_utm_json
schema_name: application_workflow.metaschema
schema_version: 0.6.0
