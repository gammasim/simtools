---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Convert ground positions to UTM
    summary: >-
      Convert a North-site array-element model parameter from ground coordinates to UTM coordinates.
  configuration:
    export: utm
    array_element_positions_file: ${generated:model_parameters/array_element_position_ground-2.0.0.json}
    log_level: DEBUG
    model_version: 6.0.2
    output_file: test.json
    output_path: simtools-output
    parameter_version: 2.0.0
    site: North
  integration_tests:
  - reference_output_file: |
     ${generated:model_parameters/array_element_position_utm-2.0.0.json}
    tolerance: 0.01
  test_name: ground_to_utm_json
schema_name: application_workflow.metaschema
schema_version: 0.4.0
