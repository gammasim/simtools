---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Convert UTM table positions to ground coordinates
    summary: >-
      Convert North-site UTM telescope positions to ground coordinates using metadata embedded in
      the table.
  configuration:
    export: ground
    array_element_positions_file: ${static:telescope_positions-North-utm.ecsv}
    log_level: DEBUG
    model_version: 6.0.2
    site: North
    output_file: test.ecsv
    output_path: simtools-output
    select_assets:
    - LSTN
    - MSTN
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test.ecsv
      validations:
      - type: reference
        file: ${static:telescope_positions-North-ground.ecsv}
        tolerance: 0.01
        columns: [position_x, position_y, position_z]
  test_name: utm_to_ground_in_table
schema_name: application_workflow.metaschema
schema_version: 0.5.0
