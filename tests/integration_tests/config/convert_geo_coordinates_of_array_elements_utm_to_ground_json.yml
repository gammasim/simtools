---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Convert UTM positions to ground coordinates
    summary: >-
      Convert a North-site array-element model parameter from UTM to local ground coordinates.
  configuration:
    export: ground
    array_element_positions_file: ${generated:model_parameters/array_element_position_utm-2.0.0.json}
    log_level: DEBUG
    model_version: 6.0.2
    output_file: test.json
    output_path: simtools-output
    parameter_version: 2.0.0
    site: North
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test.json
      validations:
      - type: reference
        file: ${generated:model_parameters/array_element_position_ground-2.0.0.json}
        tolerance: 0.01
  test_name: utm_to_ground_json
schema_name: application_workflow.metaschema
schema_version: 0.5.0
