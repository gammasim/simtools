---
applications:
- application: simtools-derive-trigger-rates
  docs:
    title: Derive proton trigger rates for North arrays
    summary: >-
      Use reduced proton events and database array layouts to derive trigger rates for an LST and
      the North Alpha array.
  configuration:
    array_layout_name:
      by_version:
        "<7.0.0":
        - LSTN-01
        - alpha
        ">=7.0.0":
        - LSTN-01
        - CTAO-North-Alpha
    event_data_file: ${generated:proton_run000001_za20deg_azm180deg_North_CTAO-North-Alpha_7.0.0_test.reduced_event_data.hdf5}
    model_version: 7.0.0
    output_path: simtools-output
    plot_histograms: false
    site: North
  test_name: protons_short
schema_name: application_workflow.metaschema
schema_version: 0.5.0
