---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Convert UTM positions using separate metadata
    summary: >-
      Convert North-site UTM telescope positions to ground coordinates using a separate metadata
      file.
  configuration:
    export: ground
    array_element_positions_file: ${static:telescope_positions-North-utm-without-cta-meta.ecsv}
    input_meta: ${static:telescope_positions-North-utm.meta.yml}
    log_level: DEBUG
    model_version: 6.0.2
    output_file: test.ecsv
    output_path: simtools-output
    select_assets:
    - LSTN
    - MSTN
  integration_tests:
  - reference_output_file: |
     ${static:telescope_positions-North-ground.ecsv}
    tolerance: 0.01
  test_name: utm_to_ground_in_yml
schema_name: application_workflow.metaschema
schema_version: 0.4.0
