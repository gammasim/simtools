---
applications:
- application: simtools-docs-produce-production-summary
  docs:
    title: Summarize simulation-model productions
    summary: >-
      Read a simulation-model repository and generate a report of its available production
      configurations.
  configuration:
    simulation_models_path: ../simulation-models
    output_path: simtools-output/reports/productions/
    output_file: production_version_descriptions.md
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: production_version_descriptions.md
  test_name: run
schema_name: application_workflow.metaschema
schema_version: 0.5.0
