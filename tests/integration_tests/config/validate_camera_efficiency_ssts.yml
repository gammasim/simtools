---
applications:
- application: simtools-validate-camera-efficiency
  docs:
    title: Validate the SSTS-design camera efficiency
    summary: >-
      Calculate South SST camera optical throughput and reference NSB rate at 20 deg zenith angle.
  configuration:
    figure_format:
    - pdf
    - png
    log_level: debug
    model_version: 7.0.0
    output_path: simtools-output
    site: South
    telescope: SSTS-design
    parameter_version: 0.0.99
    write_reference_nsb_rate_as_parameter: true
    zenith_angle: 20.0
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: validate_camera_efficiency_SSTS-design_nsb.pdf
    - path_descriptor: output_path
      file: validate_camera_efficiency_SSTS-design_nsb.png
    - path_descriptor: output_path
      file: validate_camera_efficiency_SSTS-design_shower.png
    - path_descriptor: output_path
      file: validate_camera_efficiency_SSTS-design_shower.pdf
    - path_descriptor: output_path
      file: camera_efficiency_South_SSTS-design_za20.0deg_azm000deg_shower.ecsv
    - path_descriptor: output_path
      output_sub_path: SSTS-design/nsb_pixel_rate
      file: nsb_pixel_rate-0.0.99.json
      validations:
      - type: model_parameter
        reference_parameter_name: nsb_pixel_rate
        tolerance: 0.1
    - path_descriptor: output_path
      file: camera_efficiency_summary_South_SSTS-design_za20.0deg_azm000deg.yml
      validations:
      - type: reference
        file: ${generated:camera_efficiency/camera_efficiency_summary_South_SSTS-design_za20.0deg_azm000deg.yml}
        tolerance: 0.001
  model_version_use_current: true
  test_name: SSTS
  xfail: simulation-models-issue-#62
schema_name: application_workflow.metaschema
schema_version: 0.5.0
