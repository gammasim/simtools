---
applications:
- application: simtools-derive-ctao-array-layouts
  docs:
    title: Derive North array layouts from the repository
    summary: >-
      Generate North-site array-layout parameters from the official layout repository with updated
      parameter versions.
  configuration:
    output_path: simtools-output
    parameter_version: 2.0.0
    repository_branch: main
    site: North
    updated_parameter_version: 1.0.99
  integration_tests:
  - output_file: array_layouts/array_layouts-1.0.99.json
  - output_file: array_layouts/array_layouts-1.0.99.meta.yml
  test_name: run
  xfail_network_error: true
schema_name: application_workflow.metaschema
schema_version: 0.4.0
