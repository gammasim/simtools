---
applications:
- application: simtools-validate-camera-efficiency
  docs:
    title: Validate the MSTx-FlashCam camera efficiency
    summary: >-
      Calculate South FlashCam optical throughput and reference NSB rate using the configured sky
      spectrum.
  preparation:
  - application: simtools-get-model-parameter
    configuration:
      export_model_file: true
      output_file: nsb_reference_spectrum-1.0.0-OBS-South.ecsv
      parameter: nsb_reference_spectrum
      parameter_version: 1.0.0
      site: South
  configuration:
    figure_format:
    - pdf
    - png
    log_level: debug
    model_version: 7.0.0
    nsb_spectrum: ${prepared:nsb_reference_spectrum-1.0.0-OBS-South.ecsv}
    output_path: simtools-output
    site: South
    telescope: MSTx-FlashCam
    parameter_version: 0.0.99
    write_reference_nsb_rate_as_parameter: true
    zenith_angle: 0.0
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-FlashCam_nsb.pdf
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-FlashCam_nsb.png
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-FlashCam_shower.png
    - path_descriptor: output_path
      file: validate_camera_efficiency_MSTx-FlashCam_shower.pdf
    - path_descriptor: output_path
      file: camera_efficiency_South_MSTx-FlashCam_za0.0deg_azm000deg_shower.ecsv
    - path_descriptor: output_path
      output_sub_path: MSTx-FlashCam/nsb_pixel_rate
      file: nsb_pixel_rate-0.0.99.json
      validations:
      - type: model_parameter
        reference_parameter_name: nsb_pixel_rate
        tolerance: 0.1
    - path_descriptor: output_path
      file: camera_efficiency_summary_South_MSTx-FlashCam_za0.0deg_azm000deg.yml
      validations:
      - type: reference
        file: ${generated:camera_efficiency/camera_efficiency_summary_South_MSTx-FlashCam_za0.0deg_azm000deg.yml}
        tolerance: 0.005
  model_version_use_current: true
  test_name: MSTS
schema_name: application_workflow.metaschema
schema_version: 0.6.0
