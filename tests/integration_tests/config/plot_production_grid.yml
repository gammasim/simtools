---
applications:
- application: simtools-plot-production-grid
  docs:
    title: Plot production grid points in sky coordinates
    summary: Plot production grid points using the grid points file generated by simtools-production-generate-grid.
      Plot energy range, view cone, and core scatter radius as function of zenith angle and azimuth angle.
  configuration:
    grid_points_file: tests/resources/generated/production_grid_points_horizontal.ecsv
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: production_grid_sky_projection.png
  test_name: default
schema_name: application_workflow.metaschema
schema_version: 0.5.0
