---
applications:
- application: simtools-validate-file-using-schema
  docs:
    title: Validate a current model-parameter schema
    summary: Check a schema-version 0.3 model-parameter document against the metaschema.
  preparation:
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_layouts-2.0.2.json
      parameter: array_layouts
      parameter_version: 2.0.2
      site: North
  configuration:
    data_type: schema
    file_name: ${prepared:array_layouts-2.0.2.json}
    schema_file: src/simtools/schemas/model_parameter.metaschema.yml
  test_name: json_validate_schema-0.3.0
schema_name: application_workflow.metaschema
schema_version: 0.6.0
