---
applications:
- application: simtools-derive-pulse-shape-parameters
  docs:
    title: Derive a NectarCam pulse-shape parameter
    summary: >-
      Generate a normalized camera pulse shape from configured rise and fall widths for an MST
      NectarCam model.
  configuration:
    rise_width_ns: 2.5
    fall_width_ns: 5.0
    rise_range:
    - 0.1
    - 0.9
    fall_range:
    - 0.9
    - 0.1
    dt_ns: 0.1
    time_margin_ns: 5.0
    site: North
    telescope: MSTx-NectarCam
    model_version: 7.0.0
    parameter_version: 1.0.0
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: flasher_pulse_width.json
    - path_descriptor: output_path
      file: flasher_pulse_exp_decay.json
  test_name: derive_pulse_shape_parameters_basic
schema_name: application_workflow.metaschema
schema_version: 0.5.0
