---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Convert UTM positions to Mercator coordinates
    summary: >-
      Convert North-site telescope positions from UTM to Mercator coordinates for geographic
      display.
  configuration:
    export: mercator
    array_element_positions_file: ${static:telescope_positions-North-utm.ecsv}
    log_level: DEBUG
    model_version: 6.0.2
    site: North
    output_file: test.ecsv
    output_path: simtools-output
    select_assets:
    - LSTN
    - MSTN
    skip_output_validation: true
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test.ecsv
      validations:
      - type: reference
        file: ${static:telescope_positions-North-mercator.ecsv}
        tolerance: 0.01
        columns: [latitude, longitude, altitude]
  test_name: utm_to_mercator_in_table
schema_name: application_workflow.metaschema
schema_version: 0.5.0
