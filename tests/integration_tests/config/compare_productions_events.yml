---
applications:
- application: simtools-compare-productions
  docs:
    title: Compare event-level production products
    summary: Compare trigger multiplicity and telescope participation across production histograms.
  configuration:
    comparison_level: events
    array_layout_name:
    - CTAO-North-Alpha
    production:
    - baseline
    - ${generated:gamma_diffuse_run000010_za20deg_azm000deg_North_CTAO-North-Alpha_7.0.0_test.trigger_histograms.hdf5}
    - candidate
    - ${generated:gamma_diffuse_run000010_za20deg_azm000deg_North_CTAO-North-Alpha_7.0.0_test.trigger_histograms.hdf5}
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: trigger_multiplicity.png
      output_sub_path: CTAO-North-Alpha
    - path_descriptor: output_path
      file: trigger_combination.png
      output_sub_path: CTAO-North-Alpha
    - path_descriptor: output_path
      file: telescope_participation_fraction.png
      output_sub_path: CTAO-North-Alpha
  test_name: run
schema_name: application_workflow.metaschema
schema_version: 0.5.0
