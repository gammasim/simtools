---
applications:
- application: simtools-derive-photon-electron-spectrum
  docs:
    title: Derive an LST photoelectron spectrum
    summary: >-
      Combine single-photoelectron and afterpulse measurements to derive an LST camera response
      spectrum.
  configuration:
    input_spectrum: ${downloaded:SinglePhe_spectrum_totalfit_19pixel-average_20200601.csv}
    afterpulse_spectrum: ${downloaded:Afterpulsing-probability_LST1-11PMTs_2023Oct_differential_used_pmts.ecsv}
    step_size: 0.02
    scale_afterpulse_spectrum: 1.0
    fit_afterpulse: true
    afterpulse_decay_factor_fixed_value: 15
    afterpulse_amplitude_range:
    - 4
    - 42
    use_norm_spe: true
    telescope: LSTN-01
    site: North
    log_level: DEBUG
    output_file: test_single_pe_lst.ecsv
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test_single_pe_lst.ecsv
      validations:
      - type: reference
        file: ${generated:model_parameters/pm_photoelectron_spectrum-2.1.0.ecsv}
        tolerance: 0.01
        columns: [amplitude, response, response_with_ap]
      - type: data_schema
        schema: src/simtools/schemas/model_parameters/pm_photoelectron_spectrum.schema.yml
      - type: table
        minimum_rows: 2101
        columns:
          amplitude:
            range:
              minimum: 0
              maximum: 42
          response:
            range:
              minimum: 0
              maximum: 1
          response_with_ap:
            range:
              minimum: 0
              maximum: 1
  test_name: LST_ecsv
  test_use_case: UC-150-2.1.2
schema_name: application_workflow.metaschema
schema_version: 0.5.0
