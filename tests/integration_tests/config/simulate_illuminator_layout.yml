---
applications:
- application: simtools-simulate-illuminator
  docs:
    title: Simulate the North illuminator layout
    summary: >-
      Use the modelled ILLN-01 position and orientation to ray-trace calibration light to MSTN-02.
  configuration:
    light_source: ILLN-01
    model_version: 7.0.0
    output_path: simtools-output
    site: North
    telescope: MSTN-02
    flasher_photons: 1e9
    log_level: DEBUG
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: illuminator_North_ILLN-01_7.0.0_simulate_illuminator_MSTN-02_300nm.simtel.zst
      output_sub_path: sim_telarray
      validations:
      - type: simtel
        event_type: illuminator
        event:
          pe_sum:
            range:
            - 1000
            - 10000
          photons:
            range:
            - 5000
            - 30000
  model_version_use_current: true
  test_name: run-layout
schema_name: application_workflow.metaschema
schema_version: 0.5.0
