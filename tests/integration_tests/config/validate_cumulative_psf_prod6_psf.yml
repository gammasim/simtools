---
applications:
- application: simtools-validate-cumulative-psf
  docs:
    title: Validate the cumulative LST point-spread function
    summary: Compare ray-traced LST containment radii at 20 deg zenith angle with measured PSF data.
  configuration:
    data: ${downloaded:PSFcurve_data_v2.ecsv}
    model_version: 6.0.2
    output_path: simtools-output
    site: North
    telescope: LSTN-01
    test: true
    zenith_angle: 20
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: ray_tracing_North_LSTN-01_d10.0km_za20.0deg_validate_cumulative_psf.ecsv
      output_sub_path: results
  test_name: run
schema_name: application_workflow.metaschema
schema_version: 0.5.0
