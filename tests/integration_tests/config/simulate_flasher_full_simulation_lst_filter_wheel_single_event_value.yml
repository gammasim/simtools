---
applications:
- application: simtools-simulate-flasher
  docs:
    title: Simulate LST flashes with a shared event count
    summary: >-
      Propagate two flat-fielding intensities through a South LST using the same event count for
      each setting.
  configuration:
    run_mode: full_simulation
    light_source_type: flat_fielding
    model_version: 7.0.0
    output_path: simtools-output
    site: South
    telescopes:
    - LSTS-01
    run_number: 20
    number_of_events: 2
    flasher_photons:
    - 1e6
    - 2e6
    log_level: DEBUG
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: full_simulation_run000020_South_7.0.0_simulate_flasher_LSTS-01.simtel.zst
      output_sub_path: sim_telarray
      validations:
      - type: simtel
        event_type: flasher
  model_version_use_current: true
  test_name: full_simulation_lst_filter_wheel_single_event_value
schema_name: application_workflow.metaschema
schema_version: 0.5.0
