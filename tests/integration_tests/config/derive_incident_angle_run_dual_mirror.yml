---
applications:
- application: simtools-derive-incident-angle
  docs:
    title: Derive photon incidence angles for an SST
    summary: >-
      Ray-trace an off-axis source through a dual-mirror SST and derive camera photon-incidence
      angles. Tests export of all three incidence-angle model parameters for dual-mirror telescopes.
  configuration:
    site: South
    telescope: SSTS-01
    off_axis_angles: 1.0
    number_of_photons: 10000
    model_version: 6.0.2
    output_path: simtools-output
    parameter_version: 1.0.0
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_SSTS-01_off1.ecsv
      output_sub_path: incident_angles
    - path_descriptor: output_path
      file: incident_angles_multi_derive_incident_angle_SSTS-01.png
      output_sub_path: plots
    - path_descriptor: output_path
      file: incident_angles_derive_incident_angle_SSTS-01_off1.log
      output_sub_path: logs
    # Dual-mirror telescope: exports all three incidence-angle parameters in telescope subdirectory
    - path_descriptor: output_path
      file: camera_filter_incidence_angle.ecsv
      output_sub_path: SSTS-01
    - path_descriptor: output_path
      file: camera_filter_incidence_angle.json
      output_sub_path: SSTS-01
    - path_descriptor: output_path
      file: primary_mirror_incidence_angle.ecsv
      output_sub_path: SSTS-01
    - path_descriptor: output_path
      file: primary_mirror_incidence_angle.json
      output_sub_path: SSTS-01
    - path_descriptor: output_path
      file: secondary_mirror_incidence_angle.ecsv
      output_sub_path: SSTS-01
    - path_descriptor: output_path
      file: secondary_mirror_incidence_angle.json
      output_sub_path: SSTS-01
  test_name: incident_angles_dual_mirror
schema_name: application_workflow.metaschema
schema_version: 0.5.0
