applications:
- application: simtools-db-upload-model-repository
  docs:
    title: Upload an existing local simulation-model repository
    summary: Upload model parameters and production tables from an existing local repository checkout.
  configuration:
    db_simulation_model: CTAO-Simulation-Model
    db_simulation_model_tag: v0.16.0
