---
applications:
- application: simtools-db-get-array-layouts-from-db
  docs:
    title: Export a South array from telescope classes
    summary: >-
      Build a South-site ground-coordinate layout containing the selected LST, MST, and SST classes.
  configuration:
    array_element_list:
    - LSTS
    - MSTS
    - SSTS
    coordinate_system: ground
    model_version: 6.0.2
    output_file: array_layout_south_ground_from_list.ecsv
    output_path: simtools-output
    site: South
  test_name: layout_list
schema_name: application_workflow.metaschema
schema_version: 0.5.0
