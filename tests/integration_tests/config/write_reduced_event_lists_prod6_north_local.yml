---
applications:
- application: simtools-write-reduced-event-lists
  configuration:
    input_file_list_pattern: "/lustre/fs25/group/cta/prod6/north/reduced_event_list/*.txt"
    output_path: "/lustre/fs25/group/cta/prod6/north/reduced_event_list"
    files_per_reduced_event_file: 10
    max_workers: 1
    backend: local
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: electron_z20_north_dark10p.part0001.reduced_event_data.hdf5
      validations:
      - type: hdf5_datasets
        required:
        - FILE_INFO
        - METADATA
        - SHOWERS
        - SIMULATION_METADATA
        - TRIGGERS
        minimum_rows:
          FILE_INFO: 1
          METADATA: 1
          SHOWERS: 1
          SIMULATION_METADATA: 1
          TRIGGERS: 1
      - type: hdf5_product
        product: reduced_event_data
  test_name: prod6_north_local
schema_name: application_workflow.metaschema
schema_version: 0.5.0
