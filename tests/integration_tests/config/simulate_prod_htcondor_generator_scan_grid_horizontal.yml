---
applications:
- application: simtools-simulate-prod-htcondor-generator
  docs:
    title: Generate HTCondor jobs for an NSB threshold scan
    summary: >-
      Translate a bias-curve NSB scan grid into HTCondor submission, parameter, and execution files.
  configuration:
    apptainer_image: ${static:dummy_apptainer_image.sif}
    job_grid_file: ${generated:bias_curve_scan_grids/nsb/scan_grid.ecsv}
    label: test-production-scan-grid
    log_level: DEBUG
    output_path: htcondor_submit
    priority: 5
    simulation_output: ./simulation_output_path
  integration_tests:
  - test_output_files:
    - file: simulate_prod.submit.condor
      path_descriptor: output_path
    - file: simulate_prod.submit.params.txt
      path_descriptor: output_path
    - file: simulate_prod.submit.sh
      path_descriptor: output_path
  test_name: htcondor-scan-grid-horizontal
schema_name: application_workflow.metaschema
schema_version: 0.4.0
