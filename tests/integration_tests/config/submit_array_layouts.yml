---
applications:
- application: simtools-submit-array-layouts
  docs:
    title: Prepare array layouts for model submission
    summary: >-
      Validate externally generated array-layout definitions and write them with an updated
      parameter version.
  preparation:
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_layouts-2.0.2.json
      parameter: array_layouts
      parameter_version: 2.0.2
      site: North
  configuration:
    array_layouts: ${prepared:array_layouts-2.0.2.json}
    model_version: 7.0.0
    output_path: simtools-output
    updated_parameter_version: 1.0.98
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: array_layouts-1.0.98.json
      output_sub_path: array_layouts
    - path_descriptor: output_path
      file: array_layouts-1.0.98.meta.yml
      output_sub_path: array_layouts
  model_version_use_current: true
  test_name: north
schema_name: application_workflow.metaschema
schema_version: 0.6.0
