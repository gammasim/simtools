---
applications:
- application: simtools-production-generate-grid
  docs:
    title: Production grid defined by horizontal coordinate axes.
    summary: >
      Number of events scaled by energy and zenith.
      Use corsika limits files to adjust energy ranges, view cone, and
      core scatter settings.
  configuration:
    array_layout_name: LSTN-01
    axis:
    - azimuth 310 deg 20 deg 3 linear
    - zenith 30 deg 40 deg 2 linear
    - offset 0 deg 10 deg 2 linear
    core_scatter: 10 500 m
    corsika_he_interaction: epos
    corsika_le_interaction: urqmd
    energy_range: 30 GeV 300 GeV
    corsika_limits: ${downloaded:corsika_limits.ecsv}
    model_version: 7.0.0
    showers_per_run: 5
    showers_per_run_power_law: 0.0 1 TeV
    showers_per_run_scaling: cosine_zenith
    number_of_runs: 2
    output_file: job_grid_horizontal.ecsv
    output_path: simtools-output
    primary: gamma
    simulation_software: corsika_sim_telarray
    site: North
    view_cone: 0 deg 10 deg
  integration_tests:
  - output_file: job_grid_horizontal.ecsv
    output_validation:
    - name: job_grid_content
      path_descriptor: output_path
      file: job_grid_horizontal.ecsv
      minimum_rows: 1
      unique_columns: [run_number]
      columns:
        primary:
          allowed_values: [gamma]
        azimuth_angle:
          range:
            minimum: 0.0
            maximum: 360.0
            unit: deg
        zenith_angle:
          range:
            minimum: 30.0
            maximum: 40.0
            unit: deg
        energy_min:
          range:
            minimum: 0.0
            maximum: 300.0
            unit: GeV
        energy_max:
          range:
            minimum: 30.0
            maximum: 300.0
            unit: GeV
        core_scatter_max:
          range:
            minimum: 0.0
            maximum: 500.0
            unit: m
        view_cone_min:
          range:
            minimum: 0.0
            maximum: 10.0
            unit: deg
        view_cone_max:
          range:
            minimum: 0.0
            maximum: 10.0
            unit: deg
        showers_per_run:
          range:
            minimum: 1.0
        model_version:
          allowed_values: ["7.0.0"]
        corsika_le_interaction:
          allowed_values: [urqmd]
        corsika_he_interaction:
          allowed_values: [epos]
      metadata:
        required_keys:
        - job_grid_summary
        - job_grid_format_version
        row_count: job_grid_summary.simulation_rows
        column_sums:
          showers_per_run: job_grid_summary.total_showers
      data_product_schema: src/simtools/schemas/job_grid_density.schema.yml
  model_version_use_current: true
  test_name: production_generate_grid_horizontal
schema_name: application_workflow.metaschema
schema_version: 0.4.0
