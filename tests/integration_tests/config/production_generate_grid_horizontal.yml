---
applications:
- application: simtools-production-generate-grid
  docs:
    title: Generate a zenith-azimuth production grid
    summary: >-
      Generate horizontal-coordinate simulation jobs with event counts scaled by energy and zenith
      angle and with tabulated CORSIKA limits.
  configuration:
    array_layout_name: LSTN-01
    axis:
    - azimuth 310 deg 20 deg 3 linear
    - zenith 30 deg 40 deg 2 linear
    - offset 0 deg 10 deg 2 linear
    core_scatter: 10 500 m
    corsika_he_interaction: epos
    corsika_le_interaction: urqmd
    energy_range: 30 GeV 300 GeV
    corsika_limits: ${downloaded:corsika_limits.ecsv}
    model_version: 7.0.0
    showers_per_run: 5
    showers_per_run_power_law: 0.0 1 TeV
    showers_per_run_scaling: cosine_zenith
    number_of_runs: 2
    output_file: job_grid_horizontal.ecsv
    output_path: simtools-output
    primary: gamma
    simulation_software: corsika_sim_telarray
    site: North
    view_cone: 0 deg 10 deg
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: job_grid_horizontal.ecsv
      validations:
      - type: data_schema
        schema: src/simtools/schemas/job_grid_density.schema.yml
      - type: table
        minimum_rows: 1
        unique_columns:
        - run_number
        columns:
          azimuth_angle:
            range:
              minimum: 0.0
              maximum: 360.0
              unit: deg
          energy_min:
            range:
              minimum: 0.0
              unit: GeV
              maximum: 300.0
          energy_max:
            range:
              minimum: 30.0
              unit: GeV
              maximum: 300.0
          core_scatter_max:
            range:
              minimum: 0.0
              unit: m
              maximum: 500.0
          view_cone_min:
            range:
              minimum: 0.0
              unit: deg
              maximum: 10.0
          view_cone_max:
            range:
              minimum: 0.0
              unit: deg
              maximum: 10.0
          showers_per_run:
            range:
              minimum: 1.0
          primary:
            allowed_values:
            - gamma
          zenith_angle:
            range:
              minimum: 30.0
              maximum: 40.0
              unit: deg
          model_version:
            allowed_values:
            - 7.0.0
          corsika_le_interaction:
            allowed_values:
            - urqmd
          corsika_he_interaction:
            allowed_values:
            - epos
      - type: metadata
        required_keys:
        - job_grid_summary
        - job_grid_format_version
        relations:
        - left: job_grid_summary.simulation_rows
          equals: table.row_count
        - left: job_grid_summary.total_showers
          equals: table.column_sum
          column: showers_per_run
  model_version_use_current: true
  test_name: production_generate_grid_horizontal
schema_name: application_workflow.metaschema
schema_version: 0.5.0
