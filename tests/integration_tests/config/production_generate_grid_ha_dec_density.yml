---
applications:
- application: simtools-production-generate-grid
  docs:
    title: Production grid defined on Ha/Dec axes (grid density).
    summary: >
      Full zenith coverage from 0 to 70 deg and a directed azimuth window.
      Use corsika limits files to adjust energy ranges, viecone, and
      core scatter settings.
  configuration:
    array_layout_name:
      by_version:
        "<7.0.0": 1lst
        ">=7.0.0": LSTN-01
    axis:
    # HA/Dec define the sampling frame; binning placeholders are overridden by
    # direction_grid_density in adaptive HA/Dec mode.
    - ha 0 deg 360 deg 1 linear
    - dec -40 deg 80 deg 1 linear
    - offset 0 deg 10 deg 2 linear
    # Explicit local-sky constraints for HA/Dec density filtering.
    local_zenith_range: 0 deg 70 deg
    # Directed azimuth interval (300 -> 60) across wrap-around.
    local_azimuth_range: 300 deg 60 deg
    direction_grid_density: 0.25 1/deg^2
    core_scatter: 10 500 m
    corsika_he_interaction: epos
    corsika_le_interaction: urqmd
    energy_range: 30 GeV 300 GeV
    corsika_limits: ${downloaded:corsika_limits.ecsv}
    model_version: 7.0.0
    showers_per_run: 5
    showers_per_run_power_law: 0.0 1 TeV
    number_of_runs: 2
    output_file: job_grid_ha_dec_density.ecsv
    output_path: simtools-output
    primary: gamma
    simulation_software: corsika_sim_telarray
    site: North
    view_cone: 0 deg 10 deg
  integration_tests:
  - output_file: job_grid_ha_dec_density.ecsv
    output_validation:
    - name: job_grid_content
      path_descriptor: output_path
      file: job_grid_ha_dec_density.ecsv
      minimum_rows: 1
      unique_columns: [run_number]
      columns:
        primary:
          allowed_values: [gamma]
        azimuth_angle:
          range:
            minimum: 0.0
            maximum: 360.0
            unit: deg
        zenith_angle:
          range:
            minimum: 0.0
            maximum: 70.0
            unit: deg
        ha:
          range:
            minimum: -180.0
            maximum: 180.0
            unit: deg
        dec:
          range:
            minimum: -40.0
            maximum: 80.0
            unit: deg
        energy_min:
          range:
            minimum: 0.0
            maximum: 300.0
            unit: GeV
        energy_max:
          range:
            minimum: 30.0
            maximum: 300.0
            unit: GeV
        core_scatter_max:
          range:
            minimum: 0.0
            maximum: 500.0
            unit: m
        view_cone_min:
          range:
            minimum: 0.0
            maximum: 10.0
            unit: deg
        view_cone_max:
          range:
            minimum: 0.0
            maximum: 10.0
            unit: deg
        showers_per_run:
          range:
            minimum: 1.0
        model_version:
          allowed_values: ["7.0.0"]
        corsika_le_interaction:
          allowed_values: [urqmd]
        corsika_he_interaction:
          allowed_values: [epos]
      metadata:
        required_keys:
        - job_grid_summary
        - job_grid_format_version
        row_count: job_grid_summary.simulation_rows
        column_sums:
          showers_per_run: job_grid_summary.total_showers
      data_product_schema: src/simtools/schemas/job_grid_density.schema.yml
  test_name: production_generate_grid_ha_dec_density
schema_name: application_workflow.metaschema
schema_version: 0.4.0
