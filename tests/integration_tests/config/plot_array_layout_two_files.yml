---
applications:
- application: simtools-plot-array-layout
  docs:
    title: Compare North and South array layouts
    summary: >-
      Read two ground-position tables and plot the North and South telescope layouts together.
  configuration:
    array_layout_file:
    - ${static:telescope_positions-North-ground.ecsv}
    - ${static:telescope_positions-South-ground.ecsv}
    figure_format:
    - pdf
    - png
    output_path: simtools-output
  integration_tests:
  - output_file: array_layout_telescope_positions-North-ground.pdf
  - output_file: array_layout_telescope_positions-North-ground.png
  - output_file: array_layout_telescope_positions-South-ground.pdf
  - output_file: array_layout_telescope_positions-South-ground.png
  test_name: two_files
schema_name: application_workflow.metaschema
schema_version: 0.4.0
