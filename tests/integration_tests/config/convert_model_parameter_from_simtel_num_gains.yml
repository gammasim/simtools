applications:
- application: simtools-convert-model-parameter-from-simtel
  docs:
    title: Convert the number of camera gains from sim_telarray
    summary: >-
      Extract the CT1 camera-gain count from a sim_telarray configuration and write a validated
      LSTN-01 parameter file.
  configuration:
    output_file: num_gains.json
    output_path: simtools-output
    parameter_version: 0.1.0
    schema_file: src/simtools/schemas/model_parameters/num_gains.schema.yml
    simtel_cfg_file: tests/resources/static/simtel_config_test_la_palma.cfg
    simtel_telescope_name: CT1
    telescope: LSTN-01
  test_name: num_gains
schema_name: application_workflow.metaschema
schema_version: 0.5.0
