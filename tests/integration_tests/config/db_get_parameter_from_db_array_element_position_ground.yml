---
applications:
- application: simtools-db-get-parameter-from-db
  docs:
    title: Export an MST ground position
    summary: Retrieve the North-site ground position of MSTN-09 as a versioned model parameter.
  configuration:
    log_level: DEBUG
    model_version: 6.0.2
    output_file: test.json
    output_path: simtools-output
    parameter: array_element_position_ground
    site: North
    telescope: MSTN-09
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: test.json
      validations:
      - type: reference
        file: ${generated:model_parameters/array_element_position_ground-2.0.0.json}
        tolerance: 1.0e-05
  requires_mongodb: true
  test_name: telescope_parameter_array_element_position_ground
schema_name: application_workflow.metaschema
schema_version: 0.5.0
