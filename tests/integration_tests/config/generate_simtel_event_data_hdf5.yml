---
applications:
- application: simtools-generate-simtel-event-data
  docs:
    title: Convert sim_telarray events to HDF5
    summary: >-
      Read proton sim_telarray events and export event, telescope, and metadata datasets to HDF5.
  configuration:
    simtel_file: ${generated:proton_run000001_za20deg_azm180deg_North_CTAO-North-Alpha_7.0.0_test.simtel.zst}
    max_files: 2
    output_file: output_file.hdf5
    output_path: simtools-output
    print_dataset_information: 5
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: output_file.hdf5
  test_name: hdf5
schema_name: application_workflow.metaschema
schema_version: 0.5.0
