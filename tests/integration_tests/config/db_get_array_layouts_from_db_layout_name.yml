---
applications:
- application: simtools-db-get-array-layouts-from-db
  docs:
    title: Export a named North array layout
    summary: >-
      Resolve the version-appropriate North Alpha layout and export its array-element positions.
  configuration:
    array_layout_name:
      by_version:
        "<7.0.0": alpha
        ">=7.0.0": CTAO-North-Alpha
    model_version: 6.0.2
    site: North
  requires_mongodb: true
  test_name: layout_name
schema_name: application_workflow.metaschema
schema_version: 0.5.0
