---
applications:
- application: simtools-plot-array-layout
  docs:
    title: Plot a South layout in UTM coordinates
    summary: Plot UTM positions of selected South-site LST, MST, and SST elements.
  configuration:
    array_element_list:
    - LSTS
    - MSTS
    - SSTS
    coordinate_system: utm
    figure_format:
    - pdf
    - png
    model_version: 6.0.2
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: array_layout_*.png
      minimum_matches: 1
    - path_descriptor: output_path
      file: array_layout_*.pdf
      minimum_matches: 1
  model_version_use_current: true
  test_name: from_list_south_utm
schema_name: application_workflow.metaschema
schema_version: 0.5.0
