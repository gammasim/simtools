---
applications:
- application: simtools-plot-array-layout
  docs:
    title: Plot layouts from a model-parameter file
    summary: >-
      Read array-layout definitions from JSON and plot the contained telescope configurations.
  preparation:
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_layouts-2.0.2.json
      parameter: array_layouts
      parameter_version: 2.0.2
      site: North
  configuration:
    array_layout_parameter_file: ${prepared:array_layouts-2.0.2.json}
    figure_format:
    - pdf
    - png
    model_version: 6.0.2
    output_path: simtools-output
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: array_layout_*.png
      minimum_matches: 2
    - path_descriptor: output_path
      file: array_layout_*.pdf
      minimum_matches: 2
  model_version_use_current: true
  test_name: from_array_layouts_json
schema_name: application_workflow.metaschema
schema_version: 0.8.0
