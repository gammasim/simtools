---
applications:
- application: simtools-convert-geo-coordinates-of-array-elements
  docs:
    title: Export CORSIKA telescope heights
    summary: >-
      Convert UTM telescope positions to ground coordinates using CORSIKA observation-level heights.
  configuration:
    export: ground
    array_element_positions_file: ${static:telescope_positions-North-utm.ecsv}
    log_level: DEBUG
    model_version: 6.0.2
    site: North
    output_file: test.ecsv
    output_path: simtools-output
    select_assets:
    - LSTN
    - MSTN
    skip_output_validation: true
  test_name: print_compact_corsika_telescopeheights
schema_name: application_workflow.metaschema
schema_version: 0.4.0
