---
applications:
- application: simtools-validate-file-using-schema
  docs:
    title: Validate a directory of model parameters
    summary: Validate model-parameter files in a directory with bundled schemas.
  preparation:
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_element_position_ground-2.0.0.json
      parameter: array_element_position_ground
      parameter_version: 2.0.0
      site: North
      telescope: MSTN-09
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_element_position_utm-2.0.0.json
      parameter: array_element_position_utm
      parameter_version: 2.0.0
      site: North
      telescope: MSTN-09
  - application: simtools-get-model-parameter
    configuration:
      output_file: array_layouts-2.0.2.json
      parameter: array_layouts
      parameter_version: 2.0.2
      site: North
  - application: simtools-get-model-parameter
    configuration:
      output_file: mirror_list-2.0.0.json
      parameter: mirror_list
      parameter_version: 2.0.0
      site: North
      telescope: LSTN-01
  - application: simtools-get-model-parameter
    configuration:
      output_file: schema-0.3.0/num_gains-1.0.0.json
      parameter: num_gains
      parameter_version: 1.0.0
      site: North
      telescope: MSTx-NectarCam
  configuration:
    file_directory: ${prepared:.}
  test_name: validate_directory_of_model_parameters
schema_name: application_workflow.metaschema
schema_version: 0.5.0
