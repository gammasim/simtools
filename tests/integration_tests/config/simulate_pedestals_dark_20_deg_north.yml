    run_number: 10
    sim_telarray_random_instrument_instances: 100
    site: North
    azimuth_angle: 0.0
    zenith_angle: 20
    stars: null
    nsb_scaling_factor: 1.0
  integration_tests:
  - test_outputs:
    - path_descriptor: output_path
      file: pedestals_dark_run000010_za20deg_azm000deg_North_LSTN-01_7.0.0_test-dark-pedestal-production-North.simtel.zst
      output_sub_path: sim_telarray/run000010
      validations:
      - type: simtel
        event_type: pedestal
  test_name: pedestals_dark_20_deg_north
schema_name: application_workflow.metaschema
schema_version: 0.5.0
