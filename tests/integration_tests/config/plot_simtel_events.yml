      Visualize camera signals, timing, and event-level quantities for a simulated LST calibration
      flash.
  configuration:
    simtel_file: ${generated:full_simulation_run000010_North_7.0.0_simtools-simulate-flasher_LSTN-04.simtel.zst}
    plots: all
    max_events: 1
    number_of_pixels: 3
    telescope: LSTN-04
    output_file: event_plots
    test: true
    dpi: 72
    output_path: simtools-output
  integration_tests:
  - output_file: event_plots_full_simulation_run000010_North_7.0.0_simtools-simulate-flasher_LSTN-04.simtel.pdf
  - output_file: event_plots_full_simulation_run000010_North_7.0.0_simtools-simulate-flasher_LSTN-04.simtel.plot_simtel_events.meta.yml
  test_name: flasher_event_plots
schema_name: application_workflow.metaschema
schema_version: 0.4.0
