---
name: Set up simtools tests
description: Set up Python and the simtools test environment.
inputs:
  python-version:
    description: Python version to use.
    required: false
    default: "3.14"
  install-dependencies:
    description: Install the simtools test dependencies.
    required: false
    default: "true"
  extract-simulation-model:
    description: Export simulation-model settings from .env_template.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Python setup
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: ${{ inputs.python-version }}
        check-latest: true

    - name: Python dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash -leo pipefail {0}
      run: pip install -e '.[tests]'

    - name: Extract SIMTOOLS_DB_SIMULATION_MODEL
      if: ${{ inputs.extract-simulation-model == 'true' }}
      shell: bash -leo pipefail {0}
      run: |
        if [[ "${{ inputs.install-dependencies }}" != "true" ]]; then
          python -m pip install pyyaml
        fi
        python src/simtools/applications/dependency_versions.py --format env >> "$GITHUB_ENV"
        echo "Catalog-managed runtime values exported."
