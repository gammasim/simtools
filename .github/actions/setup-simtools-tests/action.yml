---
name: Set up simtools tests
description: Set up Python and the simtools test environment.
inputs:
  python-version:
    description: Python version to use.
    required: false
    default: "3.14"
  install-dependencies:
    description: Install the simtools test dependencies.
    required: false
    default: "true"
  extract-simulation-model:
    description: Export dependency settings and select development repository branches.
    required: false
    default: "true"
  simulation-model-branch:
    description: Simulation model branch used by tests.
    required: false
    default: "main"
  simtools-tests-branch:
    description: simtools-tests branch used by tests.
    required: false
    default: "main"
runs:
  using: composite
  steps:
    - name: Python setup
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
      with:
        python-version: ${{ inputs.python-version }}
        check-latest: true

    - name: Python dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash -leo pipefail {0}
      run: pip install -e '.[tests]'

    - name: Export test repository settings
      if: ${{ inputs.extract-simulation-model == 'true' }}
      shell: bash -leo pipefail {0}
      env:
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        MODEL_BRANCH: ${{ inputs.simulation-model-branch }}
        TESTS_BRANCH: ${{ inputs.simtools-tests-branch }}
      run: |
        if [[ "$INSTALL_DEPENDENCIES" != "true" ]]; then
          python -m pip install pyyaml
        fi
        python src/simtools/applications/dependency_versions.py --format env >> "$GITHUB_ENV"
        git check-ref-format --branch "$MODEL_BRANCH"
        git check-ref-format --branch "$TESTS_BRANCH"
        {
          echo "SIMTOOLS_SIMULATION_MODELS_GIT_REVISION=$MODEL_BRANCH"
          echo "SIMTOOLS_TESTS_REF=$TESTS_BRANCH"
          echo "SIMTOOLS_TESTS_REVISION="
        } >> "$GITHUB_ENV"
