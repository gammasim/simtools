---
name: build-simtools-dev
# Build simtools images for developers based on CORSIKA / sim_telarray images (no optimizations).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*-rc*'
    paths:
      - docker/Dockerfile-simtools-dev
      - docker/check_component_architecture.py
      - .github/scripts/install_python_dependencies.sh
      - pyproject.toml
      - dependency_versions.yml
      - src/simtools/applications/dependency_versions.py
      - src/simtools/model_repository/dependency_versions.py
      - src/simtools/schemas/dependency_versions.schema.yml
      - src/simtools/applications/dependency_manifest.py
      - src/simtools/runtime/dependencies.py
      - .github/workflows/build-simtools-dev.yml
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC (build only)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

concurrency:
  group: build-simtools-dev
  cancel-in-progress: false

jobs:
  dependency-config:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.config.outputs.base_image }}
      python_version: ${{ steps.config.outputs.python_version }}
      dev_corsika_image: ${{ steps.config.outputs.dev_corsika_image }}
      dev_simtel_image: ${{ steps.config.outputs.dev_simtel_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: config
        run: |
          bash .github/scripts/install_python_dependencies.sh packaging pyyaml
          python src/simtools/applications/dependency_versions.py --format github-output >> "$GITHUB_OUTPUT"

  build-simtools-dev:
    runs-on: ${{ matrix.runner }}
    needs: dependency-config
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            suffix: ''
          - arch: arm64
            runner: ubuntu-26.04-arm
            suffix: -arm64
    permissions:
      contents: read
      packages: write
    env:
      BASE_LABEL: "simtools-dev"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set build identity
        run: |
          echo "SIMTOOLS_GIT_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}},prefix=v
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
          images: ${{ env.REGISTRY }}/gammasim/${{ env.BASE_LABEL }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ needs.dependency-config.outputs.base_image }}
            CORSIKA_IMAGE=${{ needs.dependency-config.outputs.dev_corsika_image }}${{ matrix.suffix }}
            SIMTEL_IMAGE=${{ needs.dependency-config.outputs.dev_simtel_image }}${{ matrix.suffix }}
            PYTHON_VERSION=${{ needs.dependency-config.outputs.python_version }}
            SIMTOOLS_GIT_REVISION=${{ env.SIMTOOLS_GIT_REVISION }}
          push: ${{ github.repository == 'gammasim/simtools' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc'))) }}
          file: ./docker/Dockerfile-simtools-dev
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')) && format('ghcr.io/gammasim/simtools-dev:latest-{0}', matrix.arch) || '' }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-latest:
    needs: build-simtools-dev
    if: ${{ github.repository == 'gammasim/simtools' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')) }}
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - name: Require a fresh workflow run
        if: github.run_attempt != 1
        run: |
          echo "::error::Start a new workflow to publish matching images for both architectures."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform latest
        run: |
          image="ghcr.io/gammasim/simtools-dev"
          docker buildx imagetools create --tag "$image:latest" \
            "$image:latest-amd64" "$image:latest-arm64"
