---
name: build-simtools-dev
# Build simtools images for developers based on CORSIKA / sim_telarray images (no optimizations).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-rc*'
  pull_request:
    paths:
      - docker/Dockerfile-simtools-dev
      - pyproject.toml
      - dependency_versions.yml
      - src/simtools/applications/dependency_versions.py
      - src/simtools/dependency_versions.py
      - src/simtools/schemas/dependency_versions.schema.yml
      - src/simtools/applications/dependency_manifest.py
      - src/simtools/dependencies.py
      - .github/workflows/build-simtools-dev.yml
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC (build only)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  dependency-config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.config.outputs.base_image }}
      python_version: ${{ steps.config.outputs.python_version }}
      dev_corsika_image: ${{ steps.config.outputs.dev_corsika_image }}
      dev_simtel_image: ${{ steps.config.outputs.dev_simtel_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: config
        run: |
          python -m pip install packaging pyyaml
          python src/simtools/applications/dependency_versions.py --format github-output >> "$GITHUB_OUTPUT"

  build-simtools-dev:
    runs-on: ubuntu-24.04
    needs: dependency-config
    permissions:
      contents: read
      packages: write
    env:
      BASE_LABEL: "simtools-dev"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set build identity
        run: |
          echo "SIMTOOLS_GIT_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}},prefix=v
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
          images: ${{ env.REGISTRY }}/gammasim/${{ env.BASE_LABEL }}
          flavor: |
            latest=${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')) }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            BASE_IMAGE=${{ needs.dependency-config.outputs.base_image }}
            CORSIKA_IMAGE=${{ needs.dependency-config.outputs.dev_corsika_image }}
            SIMTEL_IMAGE=${{ needs.dependency-config.outputs.dev_simtel_image }}
            OBDEECT_VERSION=0.1.0
            PYTHON_VERSION=${{ needs.dependency-config.outputs.python_version }}
            SIMTOOLS_GIT_REVISION=${{ env.SIMTOOLS_GIT_REVISION }}
          push: ${{ github.repository == 'gammasim/simtools' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc'))) }}
          file: ./docker/Dockerfile-simtools-dev
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
