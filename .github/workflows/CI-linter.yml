---
name: CI-linting

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:

  linting:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -leo pipefail {0}

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - name: Check for non-ASCII characters
        run: |
          found=0
          while IFS= read -r file; do
            matches=$(perl -ne 'print if /[^[:ascii:]]/ && !/latin/i' "$file")
            if [ -n "$matches" ]; then
              echo "File: $file"
              echo "$matches"
              found=1
            fi
          done < <(find . -type f \( -name "*.py" -o -name "*.rst" -o -name "*.yml" -o -name "*.toml" \))
          if [ "$found" -eq 1 ]; then
            echo "Non-ASCII characters found in documentation."
            exit 1
          fi

      - name: Lint Docker files
        run: |
          find ./docker -name "Dockerfile-*" -print0 | while IFS= read -r -d '' dockerfile; do
            echo "HADOLINT: $dockerfile"
            docker run --rm -i ghcr.io/hadolint/hadolint < "$dockerfile"
          done

      - name: Install and validate pyproject.toml
        run: |
          pip install validate-pyproject packaging pyyaml
          validate-pyproject pyproject.toml
          python src/simtools/applications/dependency_versions.py --format summary

      - name: Check CITATION.cff metadata
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084  # v2.0.0
        with:
          args: "--validate"

      - name: Python dependencies
        run: |
          pip install -e '.[tests,dev,doc]'
          pip check

      - name: Dotenv linter
        uses: dotenv-linter/action-dotenv-linter@afde61cfda2ecffe7bea35837b6f20b956c88689  # v3
        with:
          dotenv_linter_flags: check -i UnorderedKey .env*

      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        id: precommit-cache
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Pre-commit
        run: |
          SKIP=no-commit-to-branch pre-commit run --all-files

      - name: Save pre-commit cache
        if: success()  # only save if previous steps succeeded
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
