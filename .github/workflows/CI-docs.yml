---
name: CI-docs
# Build documentation and deploy a complete GitHub Pages artifact

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published]

jobs:

  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/CI-docs.yml

      - name: Install dependencies
        run: |
          bash .github/scripts/install_python_dependencies.sh '.[doc]'

      - name: Check for non-ASCII characters
        run: |
          output=$(perl -ne 'print if /[^[:ascii:]]/' docs/source/*)
          if [ -n "$output" ]; then
            echo "Non-ASCII characters found in documentation."
            exit 1
          fi

      - name: Check that all applications are documented
        run: |-
          scripts=$(grep 'scripts.simtools-' pyproject.toml | sed -e 's/^scripts\.//' -e 's/ =.*$//')
          FULLY_DOCUMENTED="TRUE"
          for S in $scripts; do
              if [[ ! -e "docs/source/user-guide/applications/$S.rst" \
                && ! -e "docs/source/user-guide/applications/$S.md" ]]; then
                echo "Undocumented script: $S"
                FULLY_DOCUMENTED="FALSE"
              fi
          done
          if [[ "$FULLY_DOCUMENTED" = "FALSE" ]]; then
              exit 1
          fi
        shell: /usr/bin/bash -e {0}

      - name: Check for complete API documentation
        run: |-
          MODULES=$(find src/simtools -type f -name "*.py" \
          ! -path "src/simtools/applications/*" \
          ! -name "__init__.py" \
          ! -path "src/simtools/_*" -prune)

          for M in $MODULES; do
              module=$(basename "$M" .py)
              if ! grep -q "$module" docs/source/api-reference/*.md; then
                  echo "Undocumented module: $module"
                  FULLY_DOCUMENTED="FALSE"
              fi
          done
          if [[ "$FULLY_DOCUMENTED" = "FALSE" ]]; then
              exit 1
          fi

      - name: Build docs
        shell: bash -l {0}
        env:
          SIMTOOLS_DOCS_SWITCHER_URL: https://gammasim.github.io/simtools/_static/switcher.json
        run: |
          make -C docs/ html
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Make command failed with exit code $exit_code"
            exit $exit_code
          fi
          touch docs/build/html/.nojekyll

      - name: Upload built docs
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 1

  deploy:
    runs-on: ubuntu-24.04
    needs: docs
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    environment:
      name: github-pages
    concurrency:
      group: gh-pages-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Checkout default branch manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          persist-credentials: false

      - name: Download benchmark snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release=$(jq -c '[.[][] | select(.draft and .tag_name == "benchmark-data")] |
            if length > 1 then error("duplicate benchmark drafts") else .[0] // null end' <<< "$releases")
          if [[ "$release" == "null" ]]; then
            echo "No benchmark snapshot exists yet."
            exit 0
          fi
          asset_id=$(jq -r '[.assets[] | select(.state == "uploaded" and
            (.name | test("^resource-benchmark-snapshot-[0-9]+-[0-9]+\\.tar\\.gz$")))] |
            sort_by(.created_at, .id) | last | .id // empty' <<< "$release")
          if [[ -z "$asset_id" ]]; then
            echo "Benchmark draft exists but has no complete snapshot" >&2
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > benchmark-snapshot.tar.gz
          python .github/scripts/publish_docs.py extract benchmark-snapshot.tar.gz benchmark-data

      - name: Download built docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: docs-html
          path: docs/build/html

      - name: Save release documentation archive
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          asset_present=$(gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[].name] | index("docs-site.tar.gz") != null')
          if [[ "$asset_present" == "true" ]]; then
            gh release download "$RELEASE_TAG" --pattern docs-site.tar.gz --dir release-assets
          else
            tar -C docs/build/html -czf release-assets/docs-site.tar.gz .
            gh release upload "$RELEASE_TAG" release-assets/docs-site.tar.gz
          fi

      - name: Select latest stable documentation
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" && "$PRERELEASE" == "false" ]]; then
            latest_tag="$RELEASE_TAG"
          else
            latest_tag=$(gh release list --limit 1000 \
              --json tagName,isPrerelease,isDraft,publishedAt \
              | jq -r '[.[] | select(.isPrerelease == false and .isDraft == false)] | sort_by(.publishedAt) | last | .tagName // empty')
          fi
          if [[ -n "$latest_tag" ]]; then
            if [[ "$EVENT_NAME" == "release" && "$latest_tag" == "$RELEASE_TAG" ]]; then
              mkdir -p latest-archive
              cp release-assets/docs-site.tar.gz latest-archive/docs-site.tar.gz
              echo "archive=latest-archive/docs-site.tar.gz" >> "$GITHUB_OUTPUT"
            else
              asset_present=$(gh release view "$latest_tag" --json assets \
                --jq '[.assets[].name] | index("docs-site.tar.gz") != null')
              if [[ "$asset_present" == "true" ]]; then
                mkdir -p latest-archive
                gh release download "$latest_tag" --pattern docs-site.tar.gz --dir latest-archive
                echo "archive=latest-archive/docs-site.tar.gz" >> "$GITHUB_OUTPUT"
              elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                echo "archive=docs/build/html" >> "$GITHUB_OUTPUT"
              else
                echo "Stable release $latest_tag has no docs-site.tar.gz asset" >&2
                exit 1
              fi
            fi
          else
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "archive=docs/build/html" >> "$GITHUB_OUTPUT"
            else
              echo "No stable release is available for latest documentation" >&2
              exit 1
            fi
          fi

      - name: Create latest archive from the current default branch build
        if: steps.latest.outputs.archive == 'docs/build/html'
        run: |
          set -euo pipefail
          mkdir -p latest-archive
          tar -C docs/build/html -czf latest-archive/docs-site.tar.gz .

      - name: Download selected version archives
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: default-branch/docs/_static/switcher.json
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python .github/scripts/publish_docs.py versions "$MANIFEST" \
            > "$RUNNER_TEMP/doc-versions.txt"
          mkdir -p version-archives
          while IFS= read -r version; do
            [[ -n "$version" ]] || continue
            if [[ "$EVENT_NAME" == "release" && "$version" == "$RELEASE_TAG" ]]; then
              cp release-assets/docs-site.tar.gz "version-archives/$version.tar.gz"
            else
              gh release download "$version" --pattern docs-site.tar.gz --dir "download-$version"
              mv "download-$version/docs-site.tar.gz" "version-archives/$version.tar.gz"
            fi
          done < "$RUNNER_TEMP/doc-versions.txt"

      - name: Assemble complete Pages site
        env:
          MANIFEST: default-branch/docs/_static/switcher.json
        run: |
          set -euo pipefail
          mkdir -p pages-site/dev
          mkdir -p benchmark-data
          if [[ -d benchmark-data/dev/test-resources ]]; then
            cp -a benchmark-data/dev/test-resources pages-site/dev/test-resources
          fi
          python .github/scripts/publish_docs.py assemble \
            --site pages-site \
            --manifest "$MANIFEST" \
            --archives-dir version-archives \
            --latest latest-archive/docs-site.tar.gz

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: pages-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
