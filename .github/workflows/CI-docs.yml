---
name: CI-docs
# Build and deploy docs to gh-pages

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published]

jobs:

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install '.[doc,tests]'

      - name: Check for non-ASCII characters
        run: |
          output=$(perl -ne 'print if /[^[:ascii:]]/' docs/source/*)
          if [ -n "$output" ]; then
            echo "Non-ASCII characters found in documentation."
            exit 1
          fi

      - name: Check that all applications are documented
        run: |-
          scripts=$(grep 'scripts.simtools-' pyproject.toml | sed -e 's/^scripts\.//' -e 's/ =.*$//')
          FULLY_DOCUMENTED="TRUE"
          for S in $scripts; do
              if [[ ! -e "docs/source/user-guide/applications/$S.rst" \
                && ! -e "docs/source/user-guide/applications/$S.md" ]]; then
                echo "Undocumented script: $S"
                FULLY_DOCUMENTED="FALSE"
              fi
          done
          if [[ "$FULLY_DOCUMENTED" = "FALSE" ]]; then
              exit 1
          fi
        shell: /usr/bin/bash -e {0}

      - name: Check for complete API documentation
        run: |-
          MODULES=$(find src/simtools -type f -name "*.py" \
          ! -path "src/simtools/applications/*" \
          ! -name "__init__.py" \
          ! -path "src/simtools/_*" -prune)

          for M in $MODULES; do
              module=$(basename "$M" .py)
              if ! grep -q "$module" docs/source/api-reference/*.md; then
                  echo "Undocumented module: $module"
                  FULLY_DOCUMENTED="FALSE"
              fi
          done
          if [[ "$FULLY_DOCUMENTED" = "FALSE" ]]; then
              exit 1
          fi

      - name: Build docs
        shell: bash -l {0}
        run: |
          make -C docs/ html
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Make command failed with exit code $exit_code"
            exit $exit_code
          fi
          touch docs/build/html/.nojekyll

      - name: Upload built docs
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: gh-pages-publisher
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download built docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: docs-html
          path: docs/build/html

      - name: Deploy versioned doc on release
        if: github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/build/html
          target-folder: ${{ github.ref_name }}  # e.g., v0.7.0
          clean: false

      - name: Deploy dev docs on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/build/html
          target-folder: .
          clean: false
          dry-run: true
