---
name: build-simtools-prod
# Build simtools images for production based on CORSIKA / sim_telarray images.

on:
  workflow_dispatch:
    inputs:
      avx_flag:
        description: "Build only this CPU variant"
        required: false
        default: all
        type: choice
        options:
          - all
          - generic
          - avx2
          - avx512f
          - sse4
  push:
    tags:
      - 'v*-rc*'
  pull_request:
    paths:
      - docker/Dockerfile-simtools-prod
      - pyproject.toml
      - dependency_versions.yml
      - src/simtools/applications/dependency_versions.py
      - src/simtools/dependency_versions.py
      - src/simtools/applications/dependency_manifest.py
      - src/simtools/dependencies.py
      - src/simtools/schemas/dependency_manifest.schema.yml
      - src/simtools/schemas/dependency_versions.schema.yml
      - .github/workflows/build-simtools-prod.yml
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC (build only)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  dependency-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.config.outputs.base_image }}
      python_version: ${{ steps.config.outputs.python_version }}
      production_matrix: ${{ steps.config.outputs.production_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: config
        env:
          AVX_FLAG: ${{ github.event.inputs.avx_flag || 'all' }}
        run: |
          python -m pip install packaging pyyaml
          python src/simtools/applications/dependency_versions.py --format github-output > dependency-output
          if [[ "${AVX_FLAG}" != "all" ]]; then
            production_matrix=$(sed -n 's/^production_matrix=//p' dependency-output | \
              jq -c --arg avx_flag "${AVX_FLAG}" 'map(select(.avx_flag == $avx_flag))')
            sed '/^production_matrix=/d' dependency-output > filtered-output
            printf 'production_matrix=%s\n' "${production_matrix}" >> filtered-output
            mv filtered-output dependency-output
          fi
          cat dependency-output >> "$GITHUB_OUTPUT"

  build-simtools-prod:
    runs-on: ubuntu-latest
    needs: dependency-config
    permissions:
      contents: read
      packages: write
    outputs:
      generic_tag: ${{ steps.export-tags.outputs.generic_tag }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.production_matrix) }}
    env:
      BASE_LABEL: "simtools-prod"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set build identity
        id: build-identity
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            simtools_version="${GITHUB_REF_NAME#v}"
          else
            base_version="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo 'v0.0.0')"
            simtools_version="${base_version#v}+g${GITHUB_SHA:0:7}"
          fi
          simtools_git_revision="$GITHUB_SHA"
          echo "SIMTOOLS_VERSION=${simtools_version}" >> "$GITHUB_ENV"
          echo "SIMTOOLS_GIT_REVISION=${simtools_git_revision}" >> "$GITHUB_ENV"
          echo "simtools_version=${simtools_version}" >> "$GITHUB_OUTPUT"
          echo "simtools_git_revision=${simtools_git_revision}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/gammasim/${{ env.BASE_LABEL }}
          flavor: |
            latest=false
            suffix=-${{ matrix.corsika }}-${{ matrix.sim_telarray }}-${{ matrix.avx_flag }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}},prefix=v
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Export generic tag for testing
        id: export-tags
        if: matrix.avx_flag == 'generic'
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          TAG=${TAG##*:}
          echo "generic_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Exported generic tag: $TAG"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: ${{ matrix.avx_flag == 'generic' && 'linux/amd64,linux/arm64/v8' || 'linux/amd64' }}
          build-args: |
            BASE_IMAGE=${{ needs.dependency-config.outputs.base_image }}
            CORSIKA_IMAGE=${{ matrix.corsika_image }}
            SIMTEL_IMAGE=${{ matrix.simtel_image }}
            PYTHON_VERSION=${{ needs.dependency-config.outputs.python_version }}
            SIMTOOLS_VERSION=${{ steps.build-identity.outputs.simtools_version }}
            SIMTOOLS_GIT_REVISION=${{ steps.build-identity.outputs.simtools_git_revision }}
          push: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')) }}
          file: ./docker/Dockerfile-simtools-prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=simtools-prod-${{ matrix.corsika }}-${{ matrix.sim_telarray }}-${{ matrix.avx_flag }}
          cache-to: type=gha,mode=min,scope=simtools-prod-${{ matrix.corsika }}-${{ matrix.sim_telarray }}-${{ matrix.avx_flag }}

  test-simtools-prod:
    permissions:
      contents: read
    needs: build-simtools-prod
    if: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc'))) && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","generic"]'), github.event.inputs.avx_flag || 'all')) }}
    uses: ./.github/workflows/CI-integrationtests.yml
    with:
      container_image: ghcr.io/gammasim/simtools-prod:${{ needs.build-simtools-prod.outputs.generic_tag }}
      model_versions: '["7.0.0"]'
      runner_labels: '["ubuntu-latest","ubuntu-24.04-arm"]'
