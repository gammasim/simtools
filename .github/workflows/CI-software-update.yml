---
name: Software updates
# Run regularly to update software dependencies

on:
  # Run on the first day of each month at midnight
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pre-commit-auto-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"

      - name: Install packages (as pre-commit is running on all files after autoupdate)
        run: |
          bash .github/scripts/install_python_dependencies.sh -e '.[tests,dev,doc]'

      - uses: browniebroke/pre-commit-autoupdate-action@d5663279643bd228226e60a4fe4fa9efc30c03eb  # main
        env:
          SKIP: no-commit-to-branch

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/software-dependencies
          title: Update software dependencies
          commit-message: "chore: update software dependencies"
          body: Update pre-commit hooks to current compatible versions.
