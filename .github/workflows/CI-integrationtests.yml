---
name: CI-integrationtests

permissions: {}

on:
  workflow_dispatch:
    inputs: {}
  workflow_call:
    inputs:
      container_image:
        description: 'Container image to use for tests'
        required: false
        type: string
        default: 'ghcr.io/gammasim/simtools-prod-tests:latest'
      model_versions:
        description: 'Model versions to test'
        required: false
        type: string
        default: '["7.0.0","6.0.2","5.0.0","6.0.2,6.1.1"]'
      runner_labels:
        description: 'GitHub-hosted runner labels to test'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      benchmark:
        description: 'Run serial resource measurements and upload benchmark artifacts'
        required: false
        type: boolean
        default: false
      benchmark_min_wall_time:
        description: 'Minimum integration-test wall time published as an individual chart'
        required: false
        type: number
        default: 5.0
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'tests/unit_tests/**'
  schedule:
    - cron: "0 0 * * *"
  release:
    types: [published]

jobs:

  test_building:
    if: ${{ github.event_name != 'workflow_call' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          expected = next(
              name
              for name in ZipFile(wheel).namelist()
              if name.endswith(".data/data/simtools/dependency_versions.yml")
          )
          print(f"Verified packaged dependency catalog: {expected}")
          PY

  prepare_test_resources:
    name: download test resources
    runs-on: ubuntu-latest
    outputs:
      test_resources_tag: ${{ steps.test_resources.outputs.tag }}

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Export dependency environment
        run: |
          python -m pip install pyyaml
          python src/simtools/applications/dependency_versions.py --format env >> "$GITHUB_ENV"

      - name: Set test resource version
        id: test_resources
        run: |
          test -n "$SIMTOOLS_TESTS_TAG"
          test -n "$SIMTOOLS_TESTS_REPOSITORY"
          echo "tag=$SIMTOOLS_TESTS_TAG" >> "$GITHUB_OUTPUT"
          echo "repository=$SIMTOOLS_TESTS_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Checkout test resources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ steps.test_resources.outputs.repository }}
          path: simtools-tests
          sparse-checkout: simtools-tests/${{ steps.test_resources.outputs.tag }}

      - name: Upload test resources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: simtools-test-resources
          path: simtools-tests
          if-no-files-found: error
          retention-days: 30

  integration_tests:
    needs: [prepare_test_resources]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ${{ inputs.container_image || 'ghcr.io/gammasim/simtools-prod-tests:latest' }}
      options: --user 0
    env:
      CONTAINER_IMAGE: ${{ inputs.container_image || 'ghcr.io/gammasim/simtools-prod-tests:latest' }}

    services:
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: api
          MONGO_INITDB_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mongosh --host localhost --port 27017 -u api -p password --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner_labels || '["ubuntu-latest"]') }}
        model_version: ${{ fromJSON(inputs.model_versions || '["7.0.0","6.0.2","5.0.0","6.0.2,6.1.1"]') }}
        model_source: [git]  # add mongodb to add mongodb integration tests.

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Export dependency environment
        run: python src/simtools/applications/dependency_versions.py --format env >> "$GITHUB_ENV"

      - name: Configure test resources
        run: |
          {
            echo "SIMTOOLS_TESTS_PATH=$GITHUB_WORKSPACE/simtools-tests/simtools-tests"
            echo "SIMTOOLS_TEST_RESOURCES=$GITHUB_WORKSPACE/simtools-tests/simtools-tests/${{ needs.prepare_test_resources.outputs.test_resources_tag }}/integration_tests"
          } >> "$GITHUB_ENV"

      - name: Download test resources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: simtools-test-resources
          path: simtools-tests

      - name: Create runtime environment (.env)
        run: |
          {
            if [ "${{ matrix.model_source }}" = "git" ]; then
              echo "SIMTOOLS_SIMULATION_MODELS_GIT_PATH=$SIMTOOLS_SIMULATION_MODELS_GIT_PATH"
              echo "SIMTOOLS_SIMULATION_MODELS_GIT_REVISION=$SIMTOOLS_SIMULATION_MODELS_GIT_REVISION"
            else
              echo "SIMTOOLS_DB_SERVER=mongodb"
              echo "SIMTOOLS_DB_API_USER=api"
              echo "SIMTOOLS_DB_API_PW=password"
              echo "SIMTOOLS_DB_API_PORT=27017"
              echo "SIMTOOLS_DB_SIMULATION_MODEL=$SIMTOOLS_DB_SIMULATION_MODEL"
              echo "SIMTOOLS_DB_SIMULATION_MODEL_TAG=$SIMTOOLS_DB_SIMULATION_MODEL_TAG"
            fi
            echo "SIMTOOLS_SIM_TELARRAY_PATH=$SIMTOOLS_SIM_TELARRAY_PATH"
            echo "SIMTOOLS_CORSIKA_PATH=$SIMTOOLS_CORSIKA_PATH"
            echo "SIMTOOLS_CORSIKA_INTERACTION_TABLE_PATH=$SIMTOOLS_CORSIKA_INTERACTION_TABLE_PATH"
          } | tee .env >> "$GITHUB_ENV"

      - name: Extend PATH (sim_telarray)
        run: |
          if [ -n "$SIMTOOLS_SIM_TELARRAY_PATH" ]; then
            echo "$SIMTOOLS_SIM_TELARRAY_PATH" >> "$GITHUB_PATH"
          fi

      - name: Install current simtools checkout (production test image)
        if: contains(env.CONTAINER_IMAGE, 'simtools-prod')
        run: pip install --no-cache-dir --no-deps -e .

      - name: Install Python dependencies (dev container)
        if: ${{ !contains(env.CONTAINER_IMAGE, 'simtools-prod') }}
        run: |
          pip install --no-cache-dir -e '.[tests,dev,doc,mongodb]'

      - name: Upload data to MongoDB
        if: matrix.model_source == 'mongodb'
        run: |
          git clone --local "$SIMTOOLS_SIMULATION_MODELS_GIT_PATH" "$GITHUB_WORKSPACE/simulation-models"
          simtools-db-upload-model-repository \
            --db_simulation_model "$SIMTOOLS_DB_SIMULATION_MODEL" \
            --db_simulation_model_tag "$SIMTOOLS_DB_SIMULATION_MODEL_TAG" \
            --repository_dir "$GITHUB_WORKSPACE/simulation-models"

      - name: Integration tests
        shell: bash -l {0}
        run: |
          cat .env
          MODEL_SOURCE_ARGS=()
          if [ "${{ matrix.model_source }}" = "git" ]; then
            for variable in ${!SIMTOOLS_DB_@}; do
              unset "$variable"
            done
            MODEL_SOURCE_ARGS=(
              --simulation_models_git_path="$SIMTOOLS_SIMULATION_MODELS_GIT_PATH"
              --simulation_models_git_revision="$SIMTOOLS_SIMULATION_MODELS_GIT_REVISION"
            )
          fi
          if [[ "${{ inputs.benchmark }}" == "true" ]]; then
            pytest --model_version=${{ matrix.model_version }} --color=yes \
              "${MODEL_SOURCE_ARGS[@]}" \
              -n 0 --maxfail=1 --no-cov \
              --resource-benchmark-output=resource-benchmark-${{ matrix.model_source }}-${{ matrix.model_version }} \
              --resource-benchmark-mode=integration \
              --resource-benchmark-min-wall-time=${{ inputs.benchmark_min_wall_time }} \
              tests/integration_tests/
          else
            pytest --model_version=${{ matrix.model_version }} --color=yes --durations=20 \
              "${MODEL_SOURCE_ARGS[@]}" \
              -n 4 --dist loadscope --retries 2 --retry-delay 5 --maxfail=1 --no-cov tests/integration_tests/
          fi

      - name: Upload integration resource benchmark
        if: ${{ always() && inputs.benchmark }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: resource-benchmark-${{ matrix.model_source }}-${{ matrix.model_version }}
          path: resource-benchmark-${{ matrix.model_source }}-${{ matrix.model_version }}
          if-no-files-found: error
          retention-days: 30
