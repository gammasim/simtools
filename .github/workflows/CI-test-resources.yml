---
name: CI-test-resources

on:
  workflow_dispatch:
    inputs:
      model_versions:
        description: 'JSON list of model versions for integration benchmarks'
        required: false
        type: string
        default: '["7.0.0"]'
      publish_results:
        description: 'Publish results to the GitHub Pages benchmark dashboard'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: gh-pages-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark_unit:
    name: Benchmark unit-test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Python setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install test dependencies
        run: python -m pip install -e '.[tests]'

      - name: Extract SIMTOOLS_DB_SIMULATION_MODEL
        run: |
          SIMTOOLS_DB_SIMULATION_MODEL_VERSION=$(grep 'SIMTOOLS_DB_SIMULATION_MODEL_VERSION=' .env_template | cut -d '=' -f2- | tr -d '"')
          SIMTOOLS_DB_SIMULATION_MODEL=$(grep 'SIMTOOLS_DB_SIMULATION_MODEL=' .env_template | cut -d '=' -f2- | tr -d '"')
          SIMTOOLS_DB_SIMULATION_MODEL="${SIMTOOLS_DB_SIMULATION_MODEL//\'/}"
          echo "SIMTOOLS_DB_SIMULATION_MODEL=$SIMTOOLS_DB_SIMULATION_MODEL" >> "$GITHUB_ENV"
          echo "SIMTOOLS_DB_SIMULATION_MODEL_VERSION=$SIMTOOLS_DB_SIMULATION_MODEL_VERSION" >> "$GITHUB_ENV"

      - name: Run unit resource benchmark
        env:
          SIMTOOLS_DB_SIMULATION_MODEL: ${{ env.SIMTOOLS_DB_SIMULATION_MODEL }}
          SIMTOOLS_DB_SIMULATION_MODEL_VERSION: ${{ env.SIMTOOLS_DB_SIMULATION_MODEL_VERSION }}
        run: |
          simtools-test-resources-collect \
            --output unit-resource.json \
            -- pytest --no-cov --color=yes -n 0 tests/unit_tests/
          simtools-test-resources-make-benchmark-records \
            --input unit-resource.json \
            --name unit-suite \
            --output benchmark-results.json
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          Path("run-metadata.json").write_text(
              json.dumps(
                  {
                      "commit": os.environ.get("GITHUB_SHA"),
                      "run_id": os.environ.get("GITHUB_RUN_ID"),
                      "runner_os": os.environ.get("RUNNER_OS"),
                      "runner_arch": os.environ.get("RUNNER_ARCH"),
                      "python": sys.version,
                      "platform": platform.platform(),
                      "collector_version": "1",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload unit resource benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: resource-benchmark-unit
          path: |
            unit-resource.json
            benchmark-results.json
            run-metadata.json
          if-no-files-found: error
          retention-days: 30

  benchmark_integration:
    name: Benchmark integration-test suites
    uses: ./.github/workflows/CI-integrationtests.yml
    with:
      benchmark: true
      model_versions: ${{ inputs.model_versions || '["7.0.0"]' }}
      runner_labels: '["ubuntu-latest"]'
    secrets: inherit

  publish:
    name: Publish test resource history
    needs: [benchmark_unit, benchmark_integration]
    if: >-
      ${{
        (github.event_name != 'workflow_dispatch' || inputs.publish_results) &&
        (github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download unit benchmark
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: resource-benchmark-unit
          path: benchmark-input/unit

      - name: Download integration benchmarks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: resource-benchmark-[0-9]*
          path: benchmark-input/integration

      - name: Combine benchmark records
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          records = []
          for path in Path("benchmark-input").rglob("benchmark-results.json"):
              records.extend(json.loads(path.read_text(encoding="utf-8")))
          if not records:
              raise SystemExit("No benchmark records were produced")
          Path("benchmark-results.json").write_text(
              json.dumps(records, indent=2) + "\n", encoding="utf-8"
          )
          summary = [
              "## Test resource benchmark",
              "",
              "[Open the benchmark dashboard](https://gammasim.github.io/simtools/dev/test-resources/).",
              "",
          ]
          for unit in ("wall_time_s", "cpu_time_s", "peak_rss_mib"):
              summary.extend([f"### Largest {unit}", ""])
              matching = sorted(
                  (record for record in records if record["unit"] == unit),
                  key=lambda record: record["value"],
                  reverse=True,
              )[:5]
              summary.extend(
                  f"- `{record['name']}`: {record['value']:.3f} {unit}"
                  for record in matching
              )
              summary.append("")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary), encoding="utf-8"
          )
          PY

      - name: Store benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: simtools CI test resources
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/test-resources
          auto-push: true
          max-items-in-chart: 365
