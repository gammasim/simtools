---
name: build-corsika7
# Build and push CORSIKA7 images for different CPU architectures.
# The generic (non-optimized) images are built as multi-platform images (x86_64 and arm64).
#
# The images are built and pushed when manually triggered (workflow_dispatch).
#

on:
  workflow_dispatch:
    inputs:
      corsika_config_branch:
        description: "Optional corsika7-config branch override. Leave empty to use the catalog snapshot."
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - docker/Dockerfile-corsika7
      - docker/validate_corsika7_build.sh
      - .github/scripts/clone_with_retries.sh
      - .github/workflows/build-corsika7.yml
  schedule:
    - cron: '0 0 1 * *'  # Every 1st day of the month at 00:00 UTC (build only)

permissions: {}

env:
  REGISTRY: ghcr.io
  CLOUD_URL: "https://syncandshare.desy.de/index.php/s/"

jobs:
  dependency-config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.config.outputs.base_image }}
      build_base_image: ${{ steps.config.outputs.build_base_image }}
      autoconf_version: ${{ steps.config.outputs.autoconf_version }}
      autoconf_sha256: ${{ steps.config.outputs.autoconf_sha256 }}
      default_corsika_source_snapshot: ${{ steps.config.outputs.default_corsika_source_snapshot }}
      corsika_matrix: ${{ steps.config.outputs.corsika_matrix }}
      corsika_build_matrix: ${{ steps.config.outputs.corsika_build_matrix }}
      corsika_source_matrix: ${{ steps.config.outputs.corsika_source_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: config
        run: |
          python -m pip install packaging pyyaml
          python src/simtools/applications/dependency_versions.py --format github-output >> "$GITHUB_OUTPUT"

  download-auxiliary-files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: dependency-config
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to the Container registry
        if: needs.dependency-config.outputs.default_corsika_source_snapshot != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Autoconf from the source snapshot
        if: needs.dependency-config.outputs.default_corsika_source_snapshot != ''
        env:
          SOURCE_SNAPSHOT: ${{ needs.dependency-config.outputs.default_corsika_source_snapshot }}
        run: |
          set -euo pipefail
          container_id=$(docker create "$SOURCE_SNAPSHOT" true)
          trap 'docker rm -f "$container_id"' EXIT
          docker cp "$container_id:/input/autoconf.tar.gz" autoconf.tar.gz
          echo "Restored Autoconf from $SOURCE_SNAPSHOT."

      - name: download-auxiliary-files
        if: needs.dependency-config.outputs.default_corsika_source_snapshot == ''
        env:
          CLOUD_AUTOCONF: ${{ secrets.CLOUD_AUTOCONF }}
          AUTOCONF_VERSION: ${{ needs.dependency-config.outputs.autoconf_version }}
          AUTOCONF_SHA256: ${{ needs.dependency-config.outputs.autoconf_sha256 }}
        run: |
          if curl -L --fail --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-delay 10 --retry-connrefused \
            --connect-timeout 30 \
            "https://ftp.gnu.org/gnu/autoconf/autoconf-${AUTOCONF_VERSION}.tar.gz" \
            -o autoconf.tar.gz && \
            echo "${AUTOCONF_SHA256}  autoconf.tar.gz" | sha256sum --check --strict; then
            echo "Downloaded autoconf from GNU."
          else
            echo "GNU download failed; trying the DESY cloud backup."
            curl -L --fail --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-delay 10 --retry-connrefused \
              --connect-timeout 30 \
              "${{ env.CLOUD_URL }}/${CLOUD_AUTOCONF}/download" \
              -o autoconf.tar.gz
            echo "${AUTOCONF_SHA256}  autoconf.tar.gz" | sha256sum --check --strict
          fi
      - name: upload-auxiliary-files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: upload-auxiliary-files
          path: |
            autoconf.tar.gz
          retention-days: 1

  download-corsika-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: dependency-config
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.corsika_source_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Log in to the Container registry
        if: matrix.corsika_source_snapshot != '' && inputs.corsika_config_branch == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore CORSIKA sources from the source snapshot
        if: matrix.corsika_source_snapshot != '' && inputs.corsika_config_branch == ''
        env:
          SOURCE_SNAPSHOT: ${{ matrix.corsika_source_snapshot }}
        run: |
          set -euo pipefail
          container_id=$(docker create "$SOURCE_SNAPSHOT" true)
          trap 'docker rm -f "$container_id"' EXIT
          docker cp "$container_id:/input/corsika7-source.tar.gz" corsika7-source.tar.gz
          docker cp "$container_id:/input/corsika7-source.tar.gz.sha256" corsika7-source.tar.gz.sha256
          echo "Restored CORSIKA sources from $SOURCE_SNAPSHOT."

      - name: Prepare CORSIKA sources
        if: matrix.corsika_source_snapshot == '' || inputs.corsika_config_branch != ''
        env:
          CORSIKA_SOURCE_TAG: ${{ matrix.corsika_tag }}
          CORSIKA_SOURCE_URL: ${{ matrix.corsika_source_url }}
          CORSIKA_SOURCE_REVISION: ${{ matrix.corsika_source_revision }}
          CORSIKA7_TOKEN: ${{ secrets.CORSIKA7_KIT_GITLAB }}
          CORSIKA_CONFIG_TAG: ${{ matrix.corsika_config_tag }}
          CORSIKA_CONFIG_BRANCH: ${{ inputs.corsika_config_branch }}
          CORSIKA_CONFIG_SOURCE_URL: ${{ matrix.corsika_config_source_url }}
          CORSIKA_CONFIG_REVISION: ${{ matrix.corsika_config_revision }}
          CTAO_GITLAB_MIRROR: ${{ secrets.CTAO_GITLAB_MIRROR }}
          GITHUB_MIRROR_BASE_URL: https://github.com/gammasim
          CORSIKA_OPT_PATCH_TAG: ${{ matrix.corsika_opt_patch_tag }}
          CORSIKA_OPT_PATCH_SOURCE_URL: ${{ matrix.corsika_opt_patch_source_url }}
          CORSIKA_OPT_PATCH_REVISION: ${{ matrix.corsika_opt_patch_revision }}
        run: |
          set -euo pipefail
          clone_with_mirror() {
            local source_url=$1 source_ref=$2 target=$3 expected_revision=$4
            local mirror_url="${GITHUB_MIRROR_BASE_URL%/}/${target}.git"
            mirror_url="https://x-access-token:${CTAO_GITLAB_MIRROR}@${mirror_url#https://}"
            ./.github/scripts/clone_with_retries.sh \
              "$source_url" "$source_ref" "$target" "$expected_revision" "$mirror_url"
          }

          source_url="https://oauth2:${CORSIKA7_TOKEN}@${CORSIKA_SOURCE_URL#https://}"
          source_revision=$(./.github/scripts/clone_with_retries.sh \
            "$source_url" "$CORSIKA_SOURCE_TAG" corsika7 "$CORSIKA_SOURCE_REVISION")
          printf '%s\n' "$source_revision" > corsika_revision

          config_ref="$CORSIKA_CONFIG_TAG"
          config_revision="$CORSIKA_CONFIG_REVISION"
          if [[ -n "$CORSIKA_CONFIG_BRANCH" ]]; then
            config_ref="$CORSIKA_CONFIG_BRANCH"
            config_revision=""
          fi
          config_revision=$(clone_with_mirror \
            "$CORSIKA_CONFIG_SOURCE_URL" "$config_ref" corsika7-config "$config_revision")
          printf '%s\n' "$config_revision" > corsika_config_revision

          opt_patch_revision=$(clone_with_mirror \
            "$CORSIKA_OPT_PATCH_SOURCE_URL" "$CORSIKA_OPT_PATCH_TAG" corsika-opt-patches \
            "$CORSIKA_OPT_PATCH_REVISION")
          printf '%s\n' "$opt_patch_revision" > corsika_opt_patch_revision

          rm -rf corsika7/.git corsika7-config/.git corsika-opt-patches/.git
          tar -czf corsika7-source.tar.gz \
            corsika7 corsika_revision \
            corsika7-config corsika_config_revision \
            corsika-opt-patches corsika_opt_patch_revision
          sha256sum corsika7-source.tar.gz > corsika7-source.tar.gz.sha256

      - name: Upload CORSIKA source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: corsika7-source-${{ matrix.corsika_build_id }}
          path: |
            corsika7-source.tar.gz
            corsika7-source.tar.gz.sha256
          retention-days: 1

  build-corsika7:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [dependency-config, download-auxiliary-files, download-corsika-source]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.corsika_build_matrix) }}
    env:
      BASE_LABEL: "corsika7"
      BASE_TAG: "v${{ matrix.corsika_build_id }}-${{ matrix.avx_flag }}"
      ARCH: "${{ matrix.arch }}"
      RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download auxiliary files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: upload-auxiliary-files
          path: .

      - name: Download CORSIKA source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: corsika7-source-${{ matrix.corsika_build_id }}
          path: corsika-source

      - name: Extract CORSIKA source
        run: |
          cd corsika-source
          sha256sum --check corsika7-source.tar.gz.sha256
          tar -xzf corsika7-source.tar.gz -C .

      - name: Read CORSIKA config revision
        id: corsika_config
        run: echo "revision=$(cat corsika-source/corsika_config_revision)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=raw,value=${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=ref,event=pr,suffix=-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=schedule,pattern={{date 'YYYYMMDD'}}-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
          images: ${{ env.REGISTRY }}/gammasim/${{ env.BASE_LABEL }}
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.dependency-config.outputs.base_image }}
            BUILD_BASE_IMAGE=${{ needs.dependency-config.outputs.build_base_image }}
            AVX_FLAG=${{ matrix.avx_flag }}
            CORSIKA_BUILD_ID=${{ matrix.corsika_build_id }}
            CORSIKA_SOURCE_TAG=${{ matrix.corsika_tag }}
            CORSIKA_SOURCE_REVISION=${{ matrix.corsika_source_revision }}
            CORSIKA_SOURCE_URL=${{ matrix.corsika_source_url }}
            CORSIKA_CONFIG_TAG=${{ inputs.corsika_config_branch || matrix.corsika_config_tag }}
            CORSIKA_CONFIG_SOURCE_URL=${{ matrix.corsika_config_source_url }}
            CORSIKA_CONFIG_REVISION=${{ steps.corsika_config.outputs.revision }}
            CORSIKA_OPT_PATCH_TAG=${{ matrix.corsika_opt_patch_tag }}
            CORSIKA_OPT_PATCH_SOURCE_URL=${{ matrix.corsika_opt_patch_source_url }}
            CORSIKA_OPT_PATCH_REVISION=${{ matrix.corsika_opt_patch_revision }}
            AUTOCONF_VERSION=${{ needs.dependency-config.outputs.autoconf_version }}
            AUTOCONF_SHA256=${{ needs.dependency-config.outputs.autoconf_sha256 }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          file: ./docker/Dockerfile-corsika7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-corsika7:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [dependency-config, build-corsika7]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.corsika_matrix) }}
    env:
      BASE_LABEL: "corsika7"
      BASE_TAG: "v${{ matrix.corsika_build_id }}-${{ matrix.avx_flag }}"
      IMAGE: "ghcr.io/gammasim/corsika7"
      RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract final metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=raw,value=${{ env.BASE_TAG }}
            type=ref,event=pr,suffix=-${{ env.BASE_TAG }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}-${{ env.BASE_TAG }}
            type=schedule,pattern={{date 'YYYYMMDD'}}-${{ env.BASE_TAG }}
          images: ${{ env.IMAGE }}
          flavor: latest=false

      - name: Publish image manifest
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -z "$tag" && continue
            if [ "${{ matrix.avx_flag }}" = "generic" ]; then
              docker buildx imagetools create \
                --tag "$tag" \
                "${IMAGE}:${BASE_TAG}-amd64-${RUN_TAG}" \
                "${IMAGE}:${BASE_TAG}-arm64-${RUN_TAG}"
            else
              docker buildx imagetools create \
                --tag "$tag" \
                "${IMAGE}:${BASE_TAG}-amd64-${RUN_TAG}"
            fi
          done <<< "$FINAL_TAGS"
