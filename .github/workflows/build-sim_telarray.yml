---
name: build-simtel_array
# Build and push sim_telarray images.
#
# The images are built and pushed when manually triggered (workflow_dispatch).
#

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/Dockerfile-simtel_array
      - .github/workflows/build-sim_telarray.yml
  schedule:
    - cron: '0 0 1 * *'  # Every 1st day of the month at 00:00 UTC (build only)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLOUD_URL: "https://syncandshare.desy.de/index.php/s/"

jobs:
  dependency-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.config.outputs.base_image }}
      build_base_image: ${{ steps.config.outputs.build_base_image }}
      gsl_version: ${{ steps.config.outputs.gsl_version }}
      gsl_sha256: ${{ steps.config.outputs.gsl_sha256 }}
      simtel_matrix: ${{ steps.config.outputs.simtel_matrix }}
      simtel_build_matrix: ${{ steps.config.outputs.simtel_build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: config
        run: |
          python -m pip install packaging pyyaml
          python src/simtools/applications/dependency_versions.py --format github-output >> "$GITHUB_OUTPUT"

  download-auxiliary-files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: download-auxiliary-files
        env:
          CLOUD_GSL: ${{ secrets.CLOUD_GSL }}
        run: |
          curl -L --fail --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-delay 10 --retry-connrefused \
            --connect-timeout 30 \
           "${CLOUD_URL}/${CLOUD_GSL}/download" \
           -o gsl.tar.gz
      - name: upload-auxiliary-files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: upload-auxiliary-files
          path: |
            gsl.tar.gz
          retention-days: 1

  download-simtel-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: dependency-config
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.simtel_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Prepare sim_telarray sources
        env:
          SIMTEL_TAG: ${{ matrix.simtel_tag }}
          SIMTEL_SOURCE_URL: ${{ matrix.simtel_source_url }}
          SIMTEL_REVISION: ${{ matrix.simtel_revision }}
          SIMTELARRAY_TOKEN: ${{ secrets.SIMTELARRAY_CTAO_GITLAB }}
          HESSIO_TAG: ${{ matrix.hessio_tag }}
          HESSIO_SOURCE_URL: ${{ matrix.hessio_source_url }}
          HESSIO_REVISION: ${{ matrix.hessio_revision }}
          HESSIO_TOKEN: ${{ secrets.HESSIO_CTAO_GITLAB }}
          STDTOOLS_TAG: ${{ matrix.stdtools_tag }}
          STDTOOLS_SOURCE_URL: ${{ matrix.stdtools_source_url }}
          STDTOOLS_REVISION: ${{ matrix.stdtools_revision }}
          STDTOOLS_TOKEN: ${{ secrets.STDTOOLS_CTAO_GITLAB }}
        run: |
          simtel_url="https://oauth2:${SIMTELARRAY_TOKEN}@${SIMTEL_SOURCE_URL#https://}"
          simtel_revision=$(./.github/scripts/clone_with_retries.sh \
            "$simtel_url" "$SIMTEL_TAG" sim_telarray "$SIMTEL_REVISION")
          printf '%s\n' "$simtel_revision" > simtel_revision

          hessio_url="https://oauth2:${HESSIO_TOKEN}@${HESSIO_SOURCE_URL#https://}"
          hessio_revision=$(./.github/scripts/clone_with_retries.sh \
            "$hessio_url" "$HESSIO_TAG" hessio "$HESSIO_REVISION")
          printf '%s\n' "$hessio_revision" > hessio_revision

          stdtools_url="https://oauth2:${STDTOOLS_TOKEN}@${STDTOOLS_SOURCE_URL#https://}"
          stdtools_revision=$(./.github/scripts/clone_with_retries.sh \
            "$stdtools_url" "$STDTOOLS_TAG" stdtools "$STDTOOLS_REVISION")
          printf '%s\n' "$stdtools_revision" > stdtools_revision

          rm -rf sim_telarray/.git hessio/.git stdtools/.git
          tar -czf simtel-source.tar.gz \
            sim_telarray simtel_revision \
            hessio hessio_revision \
            stdtools stdtools_revision
          sha256sum simtel-source.tar.gz > simtel-source.tar.gz.sha256

      - name: Upload sim_telarray source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: simtel-source-${{ matrix.simtel_tag }}-${{ matrix.hessio_tag }}-${{ matrix.stdtools_tag }}
          path: |
            simtel-source.tar.gz
            simtel-source.tar.gz.sha256
          retention-days: 1

  build-sim_telarray:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [dependency-config, download-auxiliary-files, download-simtel-source]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.simtel_build_matrix) }}
    env:
      BASE_LABEL: "sim_telarray"
      BASE_TAG: "${{ matrix.simtel_tag }}"
      ARCH: "${{ matrix.arch }}"
      RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download auxiliary files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: upload-auxiliary-files
          path: .

      - name: Download sim_telarray source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: simtel-source-${{ matrix.simtel_tag }}-${{ matrix.hessio_tag }}-${{ matrix.stdtools_tag }}
          path: simtel-source

      - name: Extract sim_telarray source
        run: |
          cd simtel-source
          sha256sum --check simtel-source.tar.gz.sha256
          tar -xzf simtel-source.tar.gz -C .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=raw,value=${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=ref,event=pr,suffix=-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=schedule,pattern={{date 'YYYYMMDD'}}-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
          images: ${{ env.REGISTRY }}/gammasim/${{ env.BASE_LABEL }}
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.dependency-config.outputs.base_image }}
            BUILD_BASE_IMAGE=${{ needs.dependency-config.outputs.build_base_image }}
            SIMTEL_TAG=${{ matrix.simtel_tag }}
            SIMTEL_SOURCE_URL=${{ matrix.simtel_source_url }}
            SIMTEL_REVISION=${{ matrix.simtel_revision }}
            HESSIO_TAG=${{ matrix.hessio_tag }}
            HESSIO_SOURCE_URL=${{ matrix.hessio_source_url }}
            HESSIO_REVISION=${{ matrix.hessio_revision }}
            STDTOOLS_TAG=${{ matrix.stdtools_tag }}
            STDTOOLS_SOURCE_URL=${{ matrix.stdtools_source_url }}
            STDTOOLS_REVISION=${{ matrix.stdtools_revision }}
            GSL_VERSION=${{ needs.dependency-config.outputs.gsl_version }}
            GSL_SHA256=${{ needs.dependency-config.outputs.gsl_sha256 }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          file: ./docker/Dockerfile-simtel_array
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-sim_telarray:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [dependency-config, build-sim_telarray]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.simtel_matrix) }}
    env:
      BASE_LABEL: "sim_telarray"
      BASE_TAG: "${{ matrix.simtel_tag }}"
      IMAGE: "ghcr.io/gammasim/sim_telarray"
      RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract final metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=raw,value=${{ env.BASE_TAG }}
            type=ref,event=pr,suffix=-${{ env.BASE_TAG }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}-${{ env.BASE_TAG }}
            type=schedule,pattern={{date 'YYYYMMDD'}}-${{ env.BASE_TAG }}
          images: ${{ env.IMAGE }}
          flavor: latest=true

      - name: Publish multi-platform manifest
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -z "$tag" && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE}:${BASE_TAG}-amd64-${RUN_TAG}" \
              "${IMAGE}:${BASE_TAG}-arm64-${RUN_TAG}"
          done <<< "$FINAL_TAGS"
