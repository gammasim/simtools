---
name: build-simtel_array
# Build and push sim_telarray images.
#
# The images are built and pushed when manually triggered (workflow_dispatch).
#

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Custom sim_telarray HTTPS repository URL'
        required: false
        type: string
      source_branch:
        description: 'Custom sim_telarray branch'
        required: false
        type: string
      build_name:
        description: 'Custom build name (letters, digits, underscores, dots and hyphens)'
        required: false
        type: string
  pull_request:
    paths:
      - docker/Dockerfile-simtel_array
      - .github/scripts/install_python_dependencies.sh
      - .github/workflows/build-sim_telarray.yml
  schedule:
    - cron: '0 0 1 * *'  # Every 1st day of the month at 00:00 UTC (build only)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLOUD_URL: "https://syncandshare.desy.de/index.php/s/"

jobs:
  dependency-config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.config.outputs.base_image }}
      build_base_image: ${{ steps.config.outputs.build_base_image }}
      gsl_version: ${{ steps.config.outputs.gsl_version }}
      gsl_sha256: ${{ steps.config.outputs.gsl_sha256 }}
      default_simtel_source_snapshot: ${{ steps.config.outputs.default_simtel_source_snapshot }}
      simtel_matrix: ${{ steps.config.outputs.simtel_matrix }}
      simtel_build_matrix: ${{ steps.config.outputs.simtel_build_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: config
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/install_python_dependencies.sh packaging pyyaml
          python src/simtools/applications/dependency_versions.py --format github-output > dependency-output
          if [[ -n "$SOURCE_URL$SOURCE_BRANCH$BUILD_NAME" ]]; then
            [[ "$SOURCE_URL" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9_.-]+)+$ ]]
            [[ "$SOURCE_BRANCH" =~ ^[A-Za-z0-9_./-]+$ ]]
            git check-ref-format --branch "$SOURCE_BRANCH" > /dev/null
            [[ "$BUILD_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,59}$ ]]
            build_id="custom-${BUILD_NAME}"
            for key in simtel_matrix simtel_build_matrix; do
              matrix=$(sed -n "s/^${key}=//p" dependency-output | jq -c \
                --arg url "$SOURCE_URL" --arg ref "$SOURCE_BRANCH" --arg id "$build_id" \
                '.[0].simtel_build_id as $first |
                 map(select(.simtel_build_id == $first) |
                   .simtel_source_url = $url | .simtel_tag = $ref | .simtel_build_id = $id |
                   .simtel_revision = "" | .simtel_source_snapshot = "")')
              sed "/^${key}=/d" dependency-output > filtered-output
              printf '%s=%s\n' "$key" "$matrix" >> filtered-output
              mv filtered-output dependency-output
            done
          fi
          cat dependency-output >> "$GITHUB_OUTPUT"

  download-auxiliary-files:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: dependency-config
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to the Container registry
        if: needs.dependency-config.outputs.default_simtel_source_snapshot != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore GSL from the source snapshot
        if: needs.dependency-config.outputs.default_simtel_source_snapshot != ''
        env:
          SOURCE_SNAPSHOT: ${{ needs.dependency-config.outputs.default_simtel_source_snapshot }}
        run: |
          set -euo pipefail
          container_id=$(docker create "$SOURCE_SNAPSHOT" true)
          trap 'docker rm -f "$container_id"' EXIT
          docker cp "$container_id:/input/gsl.tar.gz" gsl.tar.gz
          echo "Restored GSL from $SOURCE_SNAPSHOT."

      - name: download-auxiliary-files
        if: needs.dependency-config.outputs.default_simtel_source_snapshot == ''
        env:
          CLOUD_GSL: ${{ secrets.CLOUD_GSL }}
          GSL_VERSION: ${{ needs.dependency-config.outputs.gsl_version }}
          GSL_SHA256: ${{ needs.dependency-config.outputs.gsl_sha256 }}
        run: |
          if curl -L --fail --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-delay 10 --retry-connrefused \
            --connect-timeout 30 \
            "${CLOUD_URL}/${CLOUD_GSL}/download" \
            -o gsl.tar.gz && \
            echo "${GSL_SHA256}  gsl.tar.gz" | sha256sum --check --strict; then
            echo "Downloaded GSL from the DESY cloud backup."
          else
            echo "DESY cloud download failed; trying the GNU GSL download area."
            curl -L --fail --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-delay 10 --retry-connrefused \
              --connect-timeout 30 \
              "https://ftp.gnu.org/gnu/gsl/gsl-${GSL_VERSION}.tar.gz" \
              -o gsl.tar.gz
            echo "${GSL_SHA256}  gsl.tar.gz" | sha256sum --check --strict
          fi
      - name: upload-auxiliary-files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: upload-auxiliary-files
          path: |
            gsl.tar.gz
          retention-days: 1

  download-simtel-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    needs: dependency-config
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.simtel_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Log in to the Container registry
        if: matrix.simtel_source_snapshot != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore sim_telarray sources from the source snapshot
        if: matrix.simtel_source_snapshot != ''
        env:
          SOURCE_SNAPSHOT: ${{ matrix.simtel_source_snapshot }}
        run: |
          set -euo pipefail
          container_id=$(docker create "$SOURCE_SNAPSHOT" true)
          trap 'docker rm -f "$container_id"' EXIT
          docker cp "$container_id:/input/simtel-source.tar.gz" simtel-source.tar.gz
          docker cp "$container_id:/input/simtel-source.tar.gz.sha256" simtel-source.tar.gz.sha256
          # Older snapshots record the archive path relative to the snapshot build context.
          sed -i 's|  input/simtel-source\.tar\.gz$|  simtel-source.tar.gz|' \
            simtel-source.tar.gz.sha256
          echo "Restored sim_telarray sources from $SOURCE_SNAPSHOT."

      - name: Prepare sim_telarray sources
        if: matrix.simtel_source_snapshot == ''
        env:
          SIMTEL_TAG: ${{ matrix.simtel_tag }}
          SIMTEL_SOURCE_URL: ${{ matrix.simtel_source_url }}
          SIMTEL_REVISION: ${{ matrix.simtel_revision }}
          SIMTELARRAY_TOKEN: ${{ secrets.SIMTELARRAY_CTAO_GITLAB }}
          HESSIO_TAG: ${{ matrix.hessio_tag }}
          HESSIO_SOURCE_URL: ${{ matrix.hessio_source_url }}
          HESSIO_REVISION: ${{ matrix.hessio_revision }}
          HESSIO_TOKEN: ${{ secrets.HESSIO_CTAO_GITLAB }}
          STDTOOLS_TAG: ${{ matrix.stdtools_tag }}
          STDTOOLS_SOURCE_URL: ${{ matrix.stdtools_source_url }}
          STDTOOLS_REVISION: ${{ matrix.stdtools_revision }}
          STDTOOLS_TOKEN: ${{ secrets.STDTOOLS_CTAO_GITLAB }}
        run: |
          simtel_url="$SIMTEL_SOURCE_URL"
          if [[ "$SIMTEL_SOURCE_URL" == https://gitlab.cta-observatory.org/* ]]; then
            simtel_url="https://oauth2:${SIMTELARRAY_TOKEN}@${SIMTEL_SOURCE_URL#https://}"
          fi
          simtel_revision=$(./.github/scripts/clone_with_retries.sh \
            "$simtel_url" "$SIMTEL_TAG" sim_telarray "$SIMTEL_REVISION")
          printf '%s\n' "$simtel_revision" > simtel_revision

          hessio_url="https://oauth2:${HESSIO_TOKEN}@${HESSIO_SOURCE_URL#https://}"
          hessio_revision=$(./.github/scripts/clone_with_retries.sh \
            "$hessio_url" "$HESSIO_TAG" hessio "$HESSIO_REVISION")
          printf '%s\n' "$hessio_revision" > hessio_revision

          stdtools_url="https://oauth2:${STDTOOLS_TOKEN}@${STDTOOLS_SOURCE_URL#https://}"
          stdtools_revision=$(./.github/scripts/clone_with_retries.sh \
            "$stdtools_url" "$STDTOOLS_TAG" stdtools "$STDTOOLS_REVISION")
          printf '%s\n' "$stdtools_revision" > stdtools_revision

          rm -rf sim_telarray/.git hessio/.git stdtools/.git
          tar -czf simtel-source.tar.gz \
            sim_telarray simtel_revision \
            hessio hessio_revision \
            stdtools stdtools_revision
          sha256sum simtel-source.tar.gz > simtel-source.tar.gz.sha256

      - name: Upload sim_telarray source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: simtel-source-${{ matrix.simtel_build_id }}-${{ matrix.hessio_build_id }}-${{ matrix.stdtools_build_id }}
          path: |
            simtel-source.tar.gz
            simtel-source.tar.gz.sha256
          retention-days: 1

  build-sim_telarray:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [dependency-config, download-auxiliary-files, download-simtel-source]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.simtel_build_matrix) }}
    env:
      BASE_LABEL: "sim_telarray"
      BASE_TAG: "${{ matrix.simtel_build_id }}"
      ARCH: "${{ matrix.arch }}"
      RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download auxiliary files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: upload-auxiliary-files
          path: .

      - name: Download sim_telarray source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: simtel-source-${{ matrix.simtel_build_id }}-${{ matrix.hessio_build_id }}-${{ matrix.stdtools_build_id }}
          path: simtel-source

      - name: Extract sim_telarray source
        run: |
          cd simtel-source
          sha256sum --check simtel-source.tar.gz.sha256
          tar -xzf simtel-source.tar.gz -C .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=raw,value=${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=ref,event=pr,suffix=-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
            type=schedule,pattern={{date 'YYYYMMDD'}}-${{ env.BASE_TAG }}-${{ env.ARCH }}-${{ env.RUN_TAG }}
          images: ${{ env.REGISTRY }}/gammasim/${{ env.BASE_LABEL }}
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ needs.dependency-config.outputs.base_image }}
            BUILD_BASE_IMAGE=${{ needs.dependency-config.outputs.build_base_image }}
            SIMTEL_TAG=${{ matrix.simtel_tag }}
            SIMTEL_SOURCE_URL=${{ matrix.simtel_source_url }}
            SIMTEL_REVISION=${{ matrix.simtel_revision }}
            HESSIO_TAG=${{ matrix.hessio_tag }}
            HESSIO_SOURCE_URL=${{ matrix.hessio_source_url }}
            HESSIO_REVISION=${{ matrix.hessio_revision }}
            STDTOOLS_TAG=${{ matrix.stdtools_tag }}
            STDTOOLS_SOURCE_URL=${{ matrix.stdtools_source_url }}
            STDTOOLS_REVISION=${{ matrix.stdtools_revision }}
            GSL_VERSION=${{ needs.dependency-config.outputs.gsl_version }}
            GSL_SHA256=${{ needs.dependency-config.outputs.gsl_sha256 }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          file: ./docker/Dockerfile-simtel_array
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-sim_telarray:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [dependency-config, build-sim_telarray]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.dependency-config.outputs.simtel_matrix) }}
    env:
      BASE_LABEL: "sim_telarray"
      BASE_TAG: "${{ matrix.simtel_build_id }}"
      IMAGE: "ghcr.io/gammasim/sim_telarray"
      RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract final metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          tags: |
            type=raw,value=${{ env.BASE_TAG }}${{ inputs.build_name != '' && format('-{0}-{1}', github.run_id, github.run_attempt) || '' }}
            type=ref,event=pr,suffix=-${{ env.BASE_TAG }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}-${{ env.BASE_TAG }}
            type=schedule,pattern={{date 'YYYYMMDD'}}-${{ env.BASE_TAG }}
          images: ${{ env.IMAGE }}
          flavor: latest=${{ inputs.build_name == '' }}

      - name: Publish multi-platform manifest
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_NAME: ${{ inputs.build_name }}
          RUN_TAG: "${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          while IFS= read -r tag; do
            test -z "$tag" && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE}:${BASE_TAG}-amd64-${RUN_TAG}" \
              "${IMAGE}:${BASE_TAG}-arm64-${RUN_TAG}"
          done <<< "$FINAL_TAGS"
          if [[ -n "$BUILD_NAME" ]]; then
            printf 'Custom sim_telarray image: %s:%s-%s\n' "$IMAGE" "$BASE_TAG" "$RUN_TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
