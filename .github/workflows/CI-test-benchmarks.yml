---
name: CI-test-benchmarks

on:
  workflow_dispatch:
    inputs:
      simulation_model_branch:
        description: 'Simulation model branch'
        required: false
        type: string
        default: ''
      simtools_tests_branch:
        description: 'simtools-tests branch'
        required: false
        type: string
        default: 'main'
      model_versions:
        description: 'JSON list of model versions for integration benchmarks'
        required: false
        type: string
        default: '["7.0.0"]'
      publish_results:
        description: 'Publish results to the GitHub Pages benchmark dashboard'
        required: false
        type: boolean
        default: true
      integration_min_wall_time:
        description: 'Minimum test wall time in seconds for an individual chart'
        required: false
        type: number
        default: 5.0
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"

jobs:
  benchmark_unit:
    name: Benchmark unit-test suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up simtools tests
        uses: ./.github/actions/setup-simtools-tests
        with:
          simulation-model-branch: ${{ inputs.simulation_model_branch || vars.SIMULATION_MODEL_BRANCH || '' }}
          simtools-tests-branch: ${{ inputs.simtools_tests_branch || vars.SIMTOOLS_TESTS_BRANCH || 'main' }}

      - name: Install resource benchmark dependency
        run: bash .github/scripts/install_python_dependencies.sh -e '.[benchmark]'

      - name: Run unit resource benchmark
        run: |
          pytest --no-cov --color=yes -n 0 \
            --resource-benchmark-output=resource-benchmark-unit \
            --resource-benchmark-mode=unit \
            tests/unit_tests/

      - name: Upload unit resource benchmark
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: resource-benchmark-unit
          path: resource-benchmark-unit
          if-no-files-found: error
          retention-days: 30

  benchmark_integration:
    name: Benchmark integration-test suites
    uses: ./.github/workflows/CI-integrationtests.yml
    permissions:
      contents: read
    with:
      benchmark: true
      simulation_model_branch: ${{ inputs.simulation_model_branch || vars.SIMULATION_MODEL_BRANCH || '' }}
      simtools_tests_branch: ${{ inputs.simtools_tests_branch || vars.SIMTOOLS_TESTS_BRANCH || 'main' }}
      benchmark_min_wall_time: ${{ fromJSON(inputs.integration_min_wall_time || '5.0') }}
      model_versions: ${{ inputs.model_versions || '["7.0.0"]' }}
      runner_labels: '["ubuntu-24.04"]'
    secrets:
      CTAO_GITLAB_MIRROR: ${{ secrets.CTAO_GITLAB_MIRROR }}

  publish:
    name: Publish test resource history
    needs: [benchmark_unit, benchmark_integration]
    if: >-
      ${{
        (github.event_name != 'workflow_dispatch' || inputs.publish_results) &&
        (github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-24.04
    concurrency:
      group: gh-pages-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download unit benchmark
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: resource-benchmark-unit
          path: benchmark-input/unit

      - name: Download integration benchmarks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: resource-benchmark-git-*
          path: benchmark-input/integration

      - name: Combine benchmark records
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          records = []
          for path in Path("benchmark-input").rglob("benchmark-results.json"):
              records.extend(json.loads(path.read_text(encoding="utf-8")))
          if not records:
              raise SystemExit("No benchmark records were produced")
          Path("benchmark-results.json").write_text(
              json.dumps(records, indent=2) + "\n", encoding="utf-8"
          )
          summary = [
              "## Test resource benchmark",
              "",
              "[Open the benchmark dashboard](https://gammasim.github.io/simtools/dev/test-resources/).",
              "",
          ]
          for unit in ("wall_time_s", "cpu_time_s", "peak_rss_mib"):
              summary.extend([f"### Largest {unit}", ""])
              matching = sorted(
                  (record for record in records if record["unit"] == unit),
                  key=lambda record: record["value"],
                  reverse=True,
              )[:5]
              summary.extend(
                  f"- `{record['name']}`: {record['value']:.3f} {unit}"
                  for record in matching
              )
              summary.append("")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary), encoding="utf-8"
          )
          PY

      - name: Load the latest benchmark snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          script=.github/scripts/benchmark_snapshot.py
          mkdir -p benchmark-state
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/benchmark-releases.json"
          selection=$(python "$script" select "$RUNNER_TEMP/benchmark-releases.json")
          release_exists=$(jq -r '.release_exists' <<< "$selection")
          asset_name=$(jq -r '.asset_name' <<< "$selection")
          if [[ "$release_exists" == "false" ]]; then
            if git ls-remote --exit-code --tags origin refs/tags/benchmark-data \
              >/dev/null 2>&1; then
              echo "The benchmark-data tag exists without its draft release" >&2
              exit 1
            else
              lookup_status=$?
              if [[ "$lookup_status" -ne 2 ]]; then
                echo "Could not verify whether the benchmark-data tag exists" >&2
                exit "$lookup_status"
              fi
            fi
            gh release create benchmark-data --draft \
              --title "Benchmark history storage" \
              --notes "Automated benchmark history assets."
          fi
          if [[ -n "$asset_name" ]]; then
            gh release download benchmark-data --pattern "$asset_name" \
              --dir benchmark-state
            python .github/scripts/publish_docs.py extract \
              "benchmark-state/$asset_name" benchmark-state
            python "$script" validate-state benchmark-state/state.json
          else
            python "$script" init-state benchmark-state/state.json
          fi

      - name: Store benchmark history
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1
        with:
          name: simtools CI test benchmarks
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          external-data-json-path: benchmark-state/state.json
          gh-pages-branch: main
          benchmark-data-dir-path: benchmark-dashboard/dev/test-resources
          auto-push: false
          skip-fetch-gh-pages: true
          max-items-in-chart: 365

      - name: Build benchmark dashboard snapshot
        run: |
          set -euo pipefail
          snapshot="resource-benchmark-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          python .github/scripts/benchmark_snapshot.py build \
            --state benchmark-state/state.json \
            --dashboard .github/benchmark-dashboard/index.html \
            --snapshot "$snapshot" \
            --work-directory benchmark-snapshot
          python .github/scripts/benchmark_snapshot.py verify "$snapshot" benchmark-validated

      - name: Upload and retain benchmark snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          script=.github/scripts/benchmark_snapshot.py
          snapshot="resource-benchmark-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          gh release upload benchmark-data "$snapshot"
          mkdir -p benchmark-verify
          gh release download benchmark-data --pattern "$snapshot" --dir benchmark-verify
          expected_hash=$(sha256sum "$snapshot" | awk '{print $1}')
          uploaded_hash=$(sha256sum "benchmark-verify/$snapshot" | awk '{print $1}')
          if [[ "$uploaded_hash" != "$expected_hash" ]]; then
            echo "Uploaded benchmark snapshot checksum does not match" >&2
            exit 1
          fi
          python "$script" verify "benchmark-verify/$snapshot" benchmark-verify/extracted
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/benchmark-releases.json"
          python "$script" old-assets "$RUNNER_TEMP/benchmark-releases.json" \
            > "$RUNNER_TEMP/old-benchmark-assets.txt"
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release delete-asset benchmark-data "$asset" --yes
          done < "$RUNNER_TEMP/old-benchmark-assets.txt"

      - name: Deploy updated dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run CI-docs.yml --ref "$DEFAULT_BRANCH"
